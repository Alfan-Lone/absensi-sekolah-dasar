<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Siswa SD WARNASARI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      color: #111827;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 45px rgba(0,0,0,.12);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-icon {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 20px rgba(37,99,235,.25);
    }

    .header h1 {
      margin: 15px 0 5px;
      font-size: 28px;
      color: #111827;
    }

    .header p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .tanggal {
      text-align: center;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
      margin-bottom: 16px;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    .camera-title {
      font-weight: bold;
      font-size: 14px;
      color: #374151;
      margin-bottom: 7px;
    }

    .camera {
      width: 100%;
      background: #111827;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      height: 350px;
      display: block;
      object-fit: cover;
      background: #111827;
    }

    .camera-info {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: rgba(0,0,0,.55);
      color: white;
      padding: 9px;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
    }

    canvas {
      display: none;
    }

    .preview {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
      display: none;
    }

    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: .2s;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      background: #9ca3af !important;
      cursor: not-allowed;
      transform: none;
    }

    .foto-btn {
      background: #2563eb;
      color: white;
    }

    .masuk-btn {
      background: #16a34a;
      color: white;
    }

    .pulang-btn {
      background: #dc2626;
      color: white;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 10px;
        align-items: flex-start;
      }

      .card {
        margin-top: 10px;
        padding: 20px;
        border-radius: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      video {
        height: 320px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="header">

      <div class="header-icon">
        📚
      </div>

      <h1>
        ABSENSI SISWA
      </h1>

      <p>
        SDN WARNASARI
      </p>

    </div>


    <div
      class="tanggal"
      id="tanggal"
    >
      Memuat tanggal...
    </div>


    <!-- NAMA -->

    <label for="nama">
      Nama Siswa
    </label>

    <input
      type="text"
      id="nama"
      placeholder="Masukkan nama siswa"
      autocomplete="name"
    >


    <!-- KELAS -->

    <label for="kelas">
      Kelas
    </label>

    <select id="kelas">

      <option value="Kelas 6">
        Kelas 6
      </option>

    </select>


    <!-- KAMERA -->

    <div class="camera-title">
      Foto Selfie
    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="camera-info">
        Pastikan wajah terlihat jelas
      </div>

    </div>


    <canvas id="canvas"></canvas>


    <!-- PREVIEW -->

    <img
      id="preview"
      class="preview"
      alt="Preview foto"
    >


    <!-- AMBIL FOTO -->

    <button
      id="fotoBtn"
      class="foto-btn"
      onclick="ambilFoto()"
    >
      📷 AMBIL FOTO
    </button>


    <!-- ABSEN MASUK -->

    <button
      id="masukBtn"
      class="masuk-btn"
      onclick="absen('masuk')"
      disabled
    >
      🟢 ABSEN MASUK
    </button>


    <!-- ABSEN PULANG -->

    <button
      id="pulangBtn"
      class="pulang-btn"
      onclick="absen('pulang')"
      disabled
    >
      🔴 ABSEN PULANG
    </button>


    <div
      id="status"
      class="status"
    ></div>


    <div class="footer">
      Masukkan nama, pastikan kelas 6, lalu ambil foto untuk melakukan absensi.
    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABEL
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");

const namaInput =
  document.getElementById("nama");

const kelasInput =
  document.getElementById("kelas");

const masukBtn =
  document.getElementById("masukBtn");

const pulangBtn =
  document.getElementById("pulangBtn");

const fotoBtn =
  document.getElementById("fotoBtn");

const statusBox =
  document.getElementById("status");


let fotoBlob = null;

let sedangMengirim = false;

let cameraStream = null;


/* =====================================================
   TANGGAL
===================================================== */

function tampilkanTanggal() {

  const sekarang = new Date();

  const tanggal =
    sekarang.toLocaleDateString(
      "id-ID",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );


  document.getElementById(
    "tanggal"
  ).textContent = tanggal;
}


tampilkanTanggal();


/* =====================================================
   KAMERA
===================================================== */

async function mulaiKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );
    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",

          width: {
            ideal: 720
          },

          height: {
            ideal: 960
          }
        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    tampilkanStatus(
      "📷 Kamera siap digunakan.",
      "info"
    );


  } catch (error) {

    console.error(
      "ERROR KAMERA:",
      error
    );


    tampilkanStatus(
      "❌ Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan dan website dibuka melalui HTTPS.",
      "error"
    );
  }
}


/* =====================================================
   AMBIL FOTO
===================================================== */

function ambilFoto() {

  const nama =
    namaInput.value.trim();


  if (nama.length < 2) {

    tampilkanStatus(
      "Masukkan nama siswa terlebih dahulu.",
      "error"
    );

    namaInput.focus();

    return;
  }


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (!width || !height) {

    tampilkanStatus(
      "Kamera belum siap. Tunggu beberapa detik.",
      "error"
    );

    return;
  }


  canvas.width =
    width;

  canvas.height =
    height;


  const context =
    canvas.getContext("2d");


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  canvas.toBlob(

    function(blob) {

      if (!blob) {

        tampilkanStatus(
          "Gagal mengambil foto.",
          "error"
        );

        return;
      }


      fotoBlob =
        blob;


      if (preview.src) {

        try {

          URL.revokeObjectURL(
            preview.src
          );

        } catch (e) {}
      }


      preview.src =
        URL.createObjectURL(
          blob
        );


      preview.style.display =
        "block";


      masukBtn.disabled =
        false;

      pulangBtn.disabled =
        false;


      fotoBtn.textContent =
        "📷 AMBIL FOTO ULANG";


      tampilkanStatus(
        "✅ Foto berhasil diambil. Pilih Absen Masuk atau Pulang.",
        "success"
      );

    },

    "image/jpeg",

    0.8

  );
}


/* =====================================================
   ABSEN
===================================================== */

async function absen(jenis) {

  if (sedangMengirim) {
    return;
  }


  const nama =
    namaInput.value.trim();


  /* KELAS SELALU KELAS 6 */

  const kelas =
    "Kelas 6";


  if (nama.length < 2) {

    tampilkanStatus(
      "Masukkan nama siswa terlebih dahulu.",
      "error"
    );

    namaInput.focus();

    return;
  }


  if (!fotoBlob) {

    tampilkanStatus(
      "Ambil foto terlebih dahulu.",
      "error"
    );

    return;
  }


  sedangMengirim =
    true;


  masukBtn.disabled =
    true;

  pulangBtn.disabled =
    true;

  fotoBtn.disabled =
    true;


  tampilkanStatus(
    "⏳ Mengirim absensi...",
    "info"
  );


  try {

    /* =================================================
       TANGGAL DAN WAKTU
    ================================================= */

    const sekarang =
      new Date();


    const tanggal =
      sekarang
        .toISOString()
        .slice(0, 10);


    const waktu =
      Date.now();


    /* =================================================
       NAMA FILE
    ================================================= */

    let namaFile =
      nama
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "-"
        )
        .replace(
          /^-|-$/g,
          ""
        );


    if (!namaFile) {

      namaFile =
        "siswa";
    }


    /* =================================================
       PATH FOTO

       BUCKET:
       selfie
    ================================================= */

    const filePath =
      tanggal +
      "/" +
      namaFile +
      "-" +
      jenis +
      "-" +
      waktu +
      ".jpg";


    /* =================================================
       UPLOAD FOTO KE STORAGE selfie
    ================================================= */

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("selfie")
        .upload(
          filePath,
          fotoBlob,
          {
            contentType:
              "image/jpeg",

            upsert:
              false
          }
        );


    if (uploadError) {

      throw uploadError;
    }


    /* =================================================
       SIMPAN DATA KE DATABASE
    ================================================= */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("absensi_sd")
        .insert({

          nama:
            nama,

          kelas:
            kelas,

          jenis:
            jenis,

          foto_path:
            filePath

        });


    /* =================================================
       JIKA DATABASE GAGAL
       HAPUS FOTO
    ================================================= */

    if (insertError) {

      await supabaseClient
        .storage
        .from("selfie")
        .remove([
          filePath
        ]);


      throw insertError;
    }


    /* =================================================
       BERHASIL
    ================================================= */

    if (jenis === "masuk") {

      tampilkanStatus(
        "✅ Absen masuk berhasil!",
        "success"
      );

    } else {

      tampilkanStatus(
        "✅ Absen pulang berhasil!",
        "success"
      );

    }


    /* =================================================
       RESET FORM
    ================================================= */

    fotoBlob =
      null;


    if (preview.src) {

      try {

        URL.revokeObjectURL(
          preview.src
        );

      } catch (e) {}
    }


    preview.src =
      "";

    preview.style.display =
      "none";


    namaInput.value =
      "";


    /* KELAS TETAP KELAS 6 */

    kelasInput.value =
      "Kelas 6";


    masukBtn.disabled =
      true;

    pulangBtn.disabled =
      true;


    fotoBtn.disabled =
      false;

    fotoBtn.textContent =
      "📷 AMBIL FOTO";


  } catch (error) {

    console.error(
      "ERROR ABSENSI:",
      error
    );


    if (
      error.code === "23505"
    ) {

      if (jenis === "masuk") {

        tampilkanStatus(
          "⚠️ Siswa ini sudah melakukan absen masuk hari ini.",
          "error"
        );

      } else {

        tampilkanStatus(
          "⚠️ Siswa ini sudah melakukan absen pulang hari ini.",
          "error"
        );

      }

    } else {

      tampilkanStatus(
        "❌ Gagal menyimpan absensi: " +
        (
          error.message ||
          "Terjadi kesalahan."
        ),
        "error"
      );

    }


    masukBtn.disabled =
      !fotoBlob;

    pulangBtn.disabled =
      !fotoBlob;

    fotoBtn.disabled =
      false;

  }


  sedangMengirim =
    false;
}


/* =====================================================
   STATUS
===================================================== */

function tampilkanStatus(
  pesan,
  tipe
) {

  statusBox.textContent =
    pesan;


  statusBox.className =
    "status " + tipe;
}


/* =====================================================
   HENTIKAN KAMERA SAAT HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }

  }
);


/* =====================================================
   MULAI
===================================================== */

mulaiKamera();

</script>

</body>
</html>
