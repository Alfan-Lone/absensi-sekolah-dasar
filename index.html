<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Siswa SD Warnasari</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      color: #111827;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-icon {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .header h1 {
      margin: 15px 0 5px;
      font-size: 28px;
      color: #111827;
    }

    .header p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .tanggal {
      text-align: center;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
      color: #374151;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .kelas-box {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      color: #111827;
      font-weight: bold;
    }

    .camera-title {
      font-weight: bold;
      font-size: 14px;
      color: #374151;
      margin-bottom: 7px;
    }

    .camera {
      width: 100%;
      background: #111827;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      height: 350px;
      display: block;
      object-fit: cover;
      background: #111827;
    }

    .camera-info {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      padding: 9px;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
    }

    canvas {
      display: none;
    }

    .preview {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
      display: none;
    }

    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #9ca3af !important;
      cursor: not-allowed;
      transform: none;
    }

    .foto-btn {
      background: #2563eb;
      color: white;
    }

    .masuk-btn {
      background: #16a34a;
      color: white;
    }

    .pulang-btn {
      background: #dc2626;
      color: white;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 20px;
    }

    .bucket-info {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 5px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 10px;
        align-items: flex-start;
      }

      .card {
        margin-top: 10px;
        padding: 20px;
        border-radius: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      video {
        height: 320px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <!-- HEADER -->
    <div class="header">

      <div class="header-icon">
        📚
      </div>

      <h1>
        ABSENSI SISWA
      </h1>

      <p>
        SD WARNASARI
      </p>

    </div>


    <!-- TANGGAL -->
    <div
      class="tanggal"
      id="tanggal"
    >
      Memuat tanggal...
    </div>


    <!-- NAMA -->
    <label for="nama">
      Nama Siswa
    </label>

    <input
      type="text"
      id="nama"
      placeholder="Masukkan nama siswa"
      autocomplete="name"
    >


    <!-- KELAS -->
    <label>
      Kelas
    </label>

    <div class="kelas-box">
      Kelas 6
    </div>


    <!-- KAMERA -->
    <div class="camera-title">
      Foto Selfie
    </div>

    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="camera-info">
        Pastikan wajah terlihat jelas
      </div>

    </div>


    <!-- CANVAS -->
    <canvas id="canvas"></canvas>


    <!-- PREVIEW -->
    <img
      id="preview"
      class="preview"
      alt="Preview foto"
    >


    <!-- TOMBOL FOTO -->
    <button
      id="fotoBtn"
      class="foto-btn"
      onclick="ambilFoto()"
    >
      📷 AMBIL FOTO
    </button>


    <!-- TOMBOL MASUK -->
    <button
      id="masukBtn"
      class="masuk-btn"
      onclick="absen('masuk')"
      disabled
    >
      🟢 ABSEN MASUK
    </button>


    <!-- TOMBOL PULANG -->
    <button
      id="pulangBtn"
      class="pulang-btn"
      onclick="absen('pulang')"
      disabled
    >
      🔴 ABSEN PULANG
    </button>


    <!-- STATUS -->
    <div
      id="status"
      class="status"
    ></div>


    <div class="footer">
      Masukkan nama, pastikan kelas 6, lalu ambil foto untuk melakukan absensi.
    </div>

    <div class="bucket-info">
      Penyimpanan foto: selfie3
    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   NAMA BUCKET
===================================================== */

const BUCKET_FOTO =
  "selfie3";


/* =====================================================
   NAMA TABEL
===================================================== */

const NAMA_TABEL =
  "absensi_sd";


/* =====================================================
   ELEMENT HTML
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");

const namaInput =
  document.getElementById("nama");

const masukBtn =
  document.getElementById("masukBtn");

const pulangBtn =
  document.getElementById("pulangBtn");

const fotoBtn =
  document.getElementById("fotoBtn");

const statusBox =
  document.getElementById("status");


/* =====================================================
   VARIABEL
===================================================== */

let fotoBlob = null;

let sedangMengirim = false;

let cameraStream = null;


/* =====================================================
   TANGGAL
===================================================== */

function tampilkanTanggal() {

  const sekarang =
    new Date();

  const tanggal =
    sekarang.toLocaleDateString(
      "id-ID",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  document.getElementById(
    "tanggal"
  ).textContent =
    tanggal;
}


tampilkanTanggal();


/* =====================================================
   KAMERA
===================================================== */

async function mulaiKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );
    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 720
          },

          height: {
            ideal: 960
          }

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    tampilkanStatus(
      "📷 Kamera siap digunakan.",
      "info"
    );


  } catch (error) {

    console.error(
      "KAMERA ERROR:",
      error
    );


    tampilkanStatus(
      "❌ Kamera tidak dapat digunakan. Pastikan izin kamera diberikan dan website dibuka melalui HTTPS.",
      "error"
    );
  }
}


/* =====================================================
   AMBIL FOTO
===================================================== */

function ambilFoto() {

  const nama =
    namaInput.value.trim();


  /* CEK NAMA */

  if (
    nama.length < 2
  ) {

    tampilkanStatus(
      "Masukkan nama siswa terlebih dahulu.",
      "error"
    );

    namaInput.focus();

    return;
  }


  /* CEK KAMERA */

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    tampilkanStatus(
      "Kamera belum siap. Tunggu beberapa detik.",
      "error"
    );

    return;
  }


  /* SET CANVAS */

  canvas.width =
    width;

  canvas.height =
    height;


  const context =
    canvas.getContext("2d");


  /* FOTO */

  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /* UBAH KE BLOB */

  canvas.toBlob(

    function(blob) {

      if (!blob) {

        tampilkanStatus(
          "Gagal mengambil foto.",
          "error"
        );

        return;
      }


      fotoBlob =
        blob;


      /* HAPUS PREVIEW LAMA */

      if (
        preview.src
      ) {

        try {

          URL.revokeObjectURL(
            preview.src
          );

        } catch (e) {}

      }


      /* BUAT PREVIEW */

      preview.src =
        URL.createObjectURL(
          blob
        );


      preview.style.display =
        "block";


      /* AKTIFKAN TOMBOL */

      masukBtn.disabled =
        false;

      pulangBtn.disabled =
        false;


      fotoBtn.textContent =
        "📷 AMBIL FOTO ULANG";


      tampilkanStatus(
        "✅ Foto berhasil diambil. Pilih Absen Masuk atau Pulang.",
        "success"
      );

    },

    "image/jpeg",

    0.8

  );
}


/* =====================================================
   BUAT NAMA FILE AMAN
===================================================== */

function buatNamaFile(nama) {

  let hasil =
    nama
      .toLowerCase()
      .trim()
      .replace(
        /[^a-z0-9]+/g,
        "-"
      )
      .replace(
        /^-+|-+$/g,
        ""
      );


  if (!hasil) {

    hasil =
      "siswa";
  }


  return hasil;
}


/* =====================================================
   ABSEN
===================================================== */

async function absen(jenis) {

  if (
    sedangMengirim
  ) {

    return;
  }


  const nama =
    namaInput.value.trim();


  /* CEK NAMA */

  if (
    nama.length < 2
  ) {

    tampilkanStatus(
      "Masukkan nama siswa terlebih dahulu.",
      "error"
    );

    return;
  }


  /* CEK FOTO */

  if (!fotoBlob) {

    tampilkanStatus(
      "Ambil foto terlebih dahulu.",
      "error"
    );

    return;
  }


  sedangMengirim =
    true;


  masukBtn.disabled =
    true;

  pulangBtn.disabled =
    true;

  fotoBtn.disabled =
    true;


  tampilkanStatus(
    "⏳ Sedang menyimpan absensi...",
    "info"
  );


  let filePath =
    null;


  try {

    /* =================================================
       WAKTU
    ================================================= */

    const sekarang =
      new Date();


    const tanggal =
      sekarang
        .toISOString()
        .slice(
          0,
          10
        );


    const waktu =
      Date.now();


    /* =================================================
       NAMA FILE
    ================================================= */

    const namaFile =
      buatNamaFile(
        nama
      );


    /* =================================================
       PATH FOTO
    ================================================= */

    filePath =
      tanggal +
      "/" +
      namaFile +
      "-" +
      jenis +
      "-" +
      waktu +
      ".jpg";


    console.log(
      "Bucket:",
      BUCKET_FOTO
    );

    console.log(
      "File path:",
      filePath
    );


    /* =================================================
       UPLOAD FOTO KE BUCKET selfie3
    ================================================= */

    const uploadResult =
      await supabaseClient
        .storage
        .from(
          BUCKET_FOTO
        )
        .upload(
          filePath,
          fotoBlob,
          {
            cacheControl:
              "3600",

            contentType:
              "image/jpeg",

            upsert:
              false
          }
        );


    if (
      uploadResult.error
    ) {

      console.error(
        "UPLOAD ERROR:",
        uploadResult.error
      );

      throw new Error(
        "Gagal upload foto: " +
        uploadResult.error.message
      );
    }


    /* =================================================
       BUAT PUBLIC URL
    ================================================= */

    const publicURL =
      supabaseClient
        .storage
        .from(
          BUCKET_FOTO
        )
        .getPublicUrl(
          filePath
        );


    const fotoURL =
      publicURL.data.publicUrl;


    console.log(
      "Foto URL:",
      fotoURL
    );


    /* =================================================
       SIMPAN KE DATABASE
    ================================================= */

    const insertResult =
      await supabaseClient
        .from(
          NAMA_TABEL
        )
        .insert({

          nama:
            nama,

          kelas:
            "Kelas 6",

          jenis:
            jenis,

          foto_path:
            filePath

        });


    /* =================================================
       DATABASE ERROR
    ================================================= */

    if (
      insertResult.error
    ) {

      console.error(
        "DATABASE ERROR:",
        insertResult.error
      );


      /* HAPUS FOTO YANG SUDAH UPLOAD */

      const removeResult =
        await supabaseClient
          .storage
          .from(
            BUCKET_FOTO
          )
          .remove([
            filePath
          ]);


      if (
        removeResult.error
      ) {

        console.error(
          "GAGAL MENGHAPUS FOTO:",
          removeResult.error
        );
      }


      throw insertResult.error;
    }


    /* =================================================
       BERHASIL
    ================================================= */

    if (
      jenis === "masuk"
    ) {

      tampilkanStatus(
        "✅ Absen masuk berhasil disimpan!",
        "success"
      );

    } else {

      tampilkanStatus(
        "✅ Absen pulang berhasil disimpan!",
        "success"
      );

    }


    /* =================================================
       RESET FOTO
    ================================================= */

    fotoBlob =
      null;


    preview.style.display =
      "none";


    preview.src =
      "";


    masukBtn.disabled =
      true;

    pulangBtn.disabled =
      true;


    fotoBtn.disabled =
      false;


    fotoBtn.textContent =
      "📷 AMBIL FOTO";


    /* =================================================
       KOSONGKAN NAMA
    ================================================= */

    namaInput.value =
      "";


  } catch (error) {

    console.error(
      "ERROR ABSENSI:",
      error
    );


    /* =================================================
       ERROR DUPLIKAT
    ================================================= */

    if (
      error.code === "23505"
    ) {

      if (
        jenis === "masuk"
      ) {

        tampilkanStatus(
          "⚠️ Siswa ini sudah melakukan absen masuk hari ini.",
          "error"
        );

      } else {

        tampilkanStatus(
          "⚠️ Siswa ini sudah melakukan absen pulang hari ini.",
          "error"
        );
      }

    } else {

      tampilkanStatus(
        "❌ Gagal menyimpan absensi: " +
        error.message,
        "error"
      );
    }


    /* =================================================
       KEMBALIKAN TOMBOL
    ================================================= */

    masukBtn.disabled =
      !fotoBlob;

    pulangBtn.disabled =
      !fotoBlob;

    fotoBtn.disabled =
      false;
  }


  sedangMengirim =
    false;
}


/* =====================================================
   STATUS
===================================================== */

function tampilkanStatus(
  pesan,
  tipe
) {

  statusBox.textContent =
    pesan;

  statusBox.className =
    "status " +
    tipe;
}


/* =====================================================
   HENTIKAN KAMERA
===================================================== */

function hentikanKamera() {

  if (
    cameraStream
  ) {

    cameraStream
      .getTracks()
      .forEach(
        track => {
          track.stop();
        }
      );

    cameraStream =
      null;
  }
}


/* =====================================================
   SAAT HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    hentikanKamera();

  }
);


/* =====================================================
   MULAI
===================================================== */

mulaiKamera();

</script>

</body>
</html>
