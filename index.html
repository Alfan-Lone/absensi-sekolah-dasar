<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test Kamera Absensi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #2563eb;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 15px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: white;

      padding: 20px;

      border-radius: 20px;

      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;

      border: 2px solid #ddd;
      border-radius: 10px;

      font-size: 16px;
      background: white;
    }

    .camera {
      margin-top: 20px;

      background: #111;

      border-radius: 15px;

      overflow: hidden;
    }

    video {
      width: 100%;

      display: block;

      aspect-ratio: 3 / 4;

      object-fit: cover;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      color: white;

      background: #2563eb;

      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #status {
      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      font-weight: bold;

      background: #f1f5f9;

      color: #334155;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b !important;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📷 ABSENSI SISWA</h1>

  <label>Nama Siswa</label>

  <input
    type="text"
    id="nama"
    placeholder="Masukkan nama"
  >


  <label>Kelas</label>

  <select id="kelas">

    <option value="">
      Pilih Kelas
    </option>

    <option value="Kelas 1">
      Kelas 1
    </option>

    <option value="Kelas 2">
      Kelas 2
    </option>

    <option value="Kelas 3">
      Kelas 3
    </option>

    <option value="Kelas 4">
      Kelas 4
    </option>

    <option value="Kelas 5">
      Kelas 5
    </option>

    <option value="Kelas 6">
      Kelas 6
    </option>

  </select>


  <div class="camera">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

  </div>


  <button
    id="kameraBtn"
    onclick="bukaKamera()"
  >
    📷 AKTIFKAN KAMERA
  </button>


  <div id="status">
    Kamera belum aktif
  </div>

</div>


<script>

async function bukaKamera() {

  const video =
    document.getElementById("video");

  const status =
    document.getElementById("status");

  const tombol =
    document.getElementById("kameraBtn");


  try {

    status.className = "";

    status.textContent =
      "⏳ Meminta izin kamera...";


    /*
      PERIKSA HTTPS
    */

    if (
      location.protocol !== "https:" &&
      location.hostname !== "localhost"
    ) {

      throw new Error(
        "Website harus dibuka menggunakan HTTPS."
      );

    }


    /*
      PERIKSA KAMERA
    */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak menyediakan fitur kamera."
      );

    }


    /*
      MINTA AKSES KAMERA
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    /*
      TAMPILKAN KAMERA
    */

    video.srcObject =
      stream;


    await video.play();


    status.className =
      "success";

    status.textContent =
      "✅ Kamera berhasil aktif";


    tombol.textContent =
      "✅ KAMERA AKTIF";


    tombol.disabled =
      true;


  } catch (error) {

    console.error(
      "KAMERA ERROR:",
      error
    );


    status.className =
      "error";


    status.textContent =
      "❌ " + error.message;


  }

}

</script>

</body>
</html>
