<body>


<div class="container">

    <!-- NAMA -->

      <option value="">

      <option value="Kelas 4">

      </option>

      <option value="Kelas 5">

      </option>

      <option value="Kelas 6">
        Kelas 6
      </option>

    </select>


    <!-- KAMERA -->

    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="camera-info">

      </div>

      class="camera-button"
      onclick="bukaKamera()"
    >
      📷 AKTIFKAN KAMERA
    </button>


    <!-- ABSEN MASUK -->

    <button
      id="masukBtn"
      class="masuk"
      onclick="ambilFoto('masuk')"
      disabled
    >

    </button>

</div>



<script>


/* =====================================================
   SUPABASE
===================================================== */


const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   VARIABEL
===================================================== */


const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const preview =
  document.getElementById("preview");


const kameraBtn =
  document.getElementById("kameraBtn");


const masukBtn =
  document.getElementById("masukBtn");


const pulangBtn =
  document.getElementById("pulangBtn");


const statusBox =
  document.getElementById("status");


let cameraStream = null;

let sedangMengirim = false;



/* =====================================================
   TANGGAL WIB
===================================================== */


function dapatkanWaktuWIB() {

  const sekarang =
    new Date();


  const tanggal =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Jakarta",

        year: "numeric",

        month: "2-digit",

        day: "2-digit"
      }
    ).format(sekarang);


  const waktu =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone: "Asia/Jakarta",

        hour: "2-digit",

        minute: "2-digit",

        second: "2-digit",

        hour12: false
      }
    ).format(sekarang);


  return {

    tanggal: tanggal,

    jam: waktu

  };

}



/* =====================================================
   TAMPILKAN TANGGAL
===================================================== */


function tampilkanTanggal() {

  const sekarang =
    new Date();


  const tanggal =
    new Intl.DateTimeFormat(
      "id-ID",
      {
        timeZone: "Asia/Jakarta",

        weekday: "long",

        day: "numeric",

        month: "long",

        year: "numeric"
      }
    ).format(sekarang);


  document.getElementById(
    "tanggal"
  ).textContent =
    tanggal +
    " • WIB";

}


tampilkanTanggal();



/* =====================================================
   STATUS
===================================================== */


function tampilkanStatus(
  pesan,
  tipe
) {

  statusBox.textContent =
    pesan;

  statusBox.className =
    "status " + tipe;

}



/* =====================================================
   KAMERA
===================================================== */


async function bukaKamera() {

  try {

    tampilkanStatus(
      "⏳ Meminta izin kamera...",
      "info"
    );


    /*
      PERIKSA HTTPS
    */

    if (
      location.protocol !== "https:" &&
      location.hostname !== "localhost"
    ) {

      throw new Error(
        "Website harus menggunakan HTTPS agar kamera dapat digunakan."
      );

    }


    /*
      PERIKSA FITUR KAMERA
    */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung akses kamera."
      );

    }


    /*
      MINTA AKSES KAMERA
    */

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 720
          },

          height: {
            ideal: 960
          }

        },

        audio: false

      });


    /*
      HUBUNGKAN KE VIDEO
    */

    video.srcObject =
      cameraStream;


    await video.play();


    /*
      KAMERA BERHASIL
    */

    kameraBtn.textContent =
      "✅ KAMERA AKTIF";


    kameraBtn.disabled =
      true;


    masukBtn.disabled =
      false;


    pulangBtn.disabled =
      false;


    tampilkanStatus(
      "✅ Kamera berhasil aktif. Silakan pilih jenis absensi.",
      "success"
    );


  } catch (error) {

    console.error(
      "KAMERA ERROR:",
      error
    );


    tampilkanStatus(
      "❌ Kamera tidak dapat digunakan: " +
      error.message,
      "error"
    );

  }

}



/* =====================================================
   AMBIL FOTO
===================================================== */


function ambilFoto(
  jenis
) {


  if (sedangMengirim) {

    return;

  }


  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  /*
    CEK NAMA
  */

  if (
    nama.length < 2
  ) {

    tampilkanStatus(
      "❌ Masukkan nama siswa terlebih dahulu.",
      "error"
    );

    document.getElementById(
      "nama"
    ).focus();

    return;

  }


  /*
    CEK KELAS
  */

  if (!kelas) {

    tampilkanStatus(
      "❌ Pilih kelas terlebih dahulu.",
      "error"
    );

    document.getElementById(
      "kelas"
    ).focus();

    return;

  }


  /*
    CEK KAMERA
  */

  if (
    !cameraStream
  ) {

    tampilkanStatus(
      "❌ Kamera belum aktif.",
      "error"
    );

    return;

  }


  /*
    CEK VIDEO
  */

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    tampilkanStatus(
      "❌ Kamera belum siap. Tunggu sebentar.",
      "error"
    );

    return;

  }


  /*
    AMBIL FOTO DARI VIDEO
  */

  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  canvas.width =
    width;


  canvas.height =
    height;


  const context =
    canvas.getContext("2d");


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
    BUAT FILE JPG
  */

  canvas.toBlob(

    async function(blob) {

      if (!blob) {

        tampilkanStatus(
          "❌ Gagal mengambil foto.",
          "error"
        );

        return;

      }


      /*
        PREVIEW FOTO
      */

      preview.src =
        URL.createObjectURL(blob);


      preview.style.display =
        "block";


      /*
        KIRIM KE SUPABASE
      */

      await kirimAbsensi(
        jenis,
        blob,
        nama,
        kelas
      );

    },

    "image/jpeg",

    0.8

  );

}



/* =====================================================
   KIRIM ABSENSI
===================================================== */


async function kirimAbsensi(
  jenis,
  fotoBlob,
  nama,
  kelas
) {


  sedangMengirim =
    true;


  masukBtn.disabled =
    true;


  pulangBtn.disabled =
    true;


  tampilkanStatus(
    "⏳ Mengupload foto dan menyimpan absensi...",
    "info"
  );


  try {


    /*
      AMBIL TANGGAL + JAM WIB

      Ini sengaja dibuat menggunakan
      Asia/Jakarta agar tidak terkena
      masalah UTC.
    */

    const waktu =
      dapatkanWaktuWIB();


    const tanggal =
      waktu.tanggal;


    const jam =
      waktu.jam;


    /*
      BUAT NAMA FILE
    */

    const namaFile =
      nama
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "-"
        )
        .replace(
          /^-|-$/g,
          ""
        );


    const timestamp =
      Date.now();


    const filePath =
      tanggal +
      "/" +
      namaFile +
      "-" +
      jenis +
      "-" +
      timestamp +
      ".jpg";


    /*
      UPLOAD FOTO
    */

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("selfies")
        .upload(

          filePath,

          fotoBlob,

          {
            contentType:
              "image/jpeg",

            upsert:
              false
          }

        );


    if (
      uploadError
    ) {

      throw uploadError;

    }


    /*
      SIMPAN DATA ABSENSI
    */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("absensi")
        .insert({

          nama:
            nama,

          kelas:
            kelas,

          tanggal:
            tanggal,

          jam:
            jam,

          jenis:
            jenis,

          foto_path:
            filePath

        });


    /*
      JIKA DATABASE GAGAL
      HAPUS FOTO
    */

    if (
      insertError
    ) {

      await supabaseClient
        .storage
        .from("selfies")
        .remove([
          filePath
        ]);


      throw insertError;

    }


    /*
      BERHASIL
    */

    if (
      jenis === "masuk"
    ) {

      tampilkanStatus(
        "✅ Absen masuk berhasil disimpan!",
        "success"
      );

    } else {

      tampilkanStatus(
        "✅ Absen pulang berhasil disimpan!",
        "success"
      );

    }


    /*
      RESET FORM
    */

    document.getElementById(
      "nama"
    ).value = "";


    document.getElementById(
      "kelas"
    ).value = "";


    preview.style.display =
      "none";


    preview.src =
      "";


  } catch (error) {


    console.error(
      "ABSENSI ERROR:",
      error
    );


    /*
      DUPLICATE DATA
    */

    if (
      error.code === "23505"
    ) {

      if (
        jenis === "masuk"
      ) {

        tampilkanStatus(
          "⚠️ Siswa tersebut sudah melakukan absen masuk hari ini.",
          "error"
        );

      } else {

        tampilkanStatus(
          "⚠️ Siswa tersebut sudah melakukan absen pulang hari ini.",
          "error"
        );

      }


    } else {

      tampilkanStatus(
        "❌ Gagal menyimpan absensi: " +
        error.message,
        "error"
      );

    }

  }


  /*
    SELESAI MENGIRIM
  */

  sedangMengirim =
    false;


  /*
    AKTIFKAN LAGI TOMBOL
  */

  if (
    cameraStream
  ) {

    masukBtn.disabled =
      false;

    pulangBtn.disabled =
      false;

  }

}



/* =====================================================
   MATIKAN KAMERA SAAT HALAMAN DITINGGALKAN
===================================================== */


window.addEventListener(
  "beforeunload",
  function() {

    if (
      cameraStream
    ) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);


</script>

</body>

</html>
