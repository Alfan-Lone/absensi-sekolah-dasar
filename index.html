<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Murid</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #0f172a,
        #1d4ed8
      );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;

      box-shadow:
        0 20px 50px rgba(0,0,0,.25);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .icon {
      width: 70px;
      height: 70px;

      margin: auto;
      margin-bottom: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eff6ff;

      border-radius: 20px;

      font-size: 35px;
    }

    h1 {
      margin: 0;

      font-size: 27px;

      color: #0f172a;
    }

    .subtitle {
      margin-top: 7px;

      color: #64748b;

      font-size: 14px;
    }

    .date {
      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 14px;

      padding: 12px;

      text-align: center;

      margin-bottom: 22px;

      color: #334155;

      font-weight: bold;

      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: bold;

      color: #334155;
    }

    input,
    select {
      width: 100%;

      padding: 14px;

      border: 1px solid #cbd5e1;

      border-radius: 12px;

      font-size: 15px;

      outline: none;

      background: white;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);
    }

    .camera-title {
      display: flex;

      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: bold;
    }

    .camera-status {
      color: #16a34a;

      font-size: 11px;
    }

    .camera {
      position: relative;

      overflow: hidden;

      border-radius: 18px;

      background: #020617;

      border: 2px solid #e2e8f0;

      margin-bottom: 15px;
    }

    video {
      width: 100%;

      display: block;

      aspect-ratio: 3 / 4;

      object-fit: cover;
    }

    .camera-overlay {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding: 12px;

      text-align: center;

      color: white;

      font-size: 12px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.75)
        );
    }

    canvas {
      display: none;
    }

    .preview {
      display: none;

      width: 100%;

      border-radius: 15px;

      margin-bottom: 12px;
    }

    button {
      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      margin-top: 8px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }

    .masuk {
      background: #2563eb;
      color: white;
    }

    .pulang {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      background: #cbd5e1;

      color: #64748b;

      cursor: not-allowed;
    }

    .status {
      display: none;

      margin-top: 15px;

      padding: 13px;

      border-radius: 12px;

      text-align: center;

      font-size: 13px;

      font-weight: bold;
    }

    .success {
      display: block;

      background: #dcfce7;

      color: #166534;
    }

    .error {
      display: block;

      background: #fee2e2;

      color: #991b1b;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #94a3b8;

      font-size: 11px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="header">

      <div class="icon">
        👨‍🎓
      </div>

      <h1>ABSENSI MURID</h1>

      <div class="subtitle">
        Sistem Absensi Siswa
      </div>

    </div>


    <div
      class="date"
      id="tanggal"
    >
      Memuat tanggal...
    </div>


    <!-- NAMA -->

    <div class="form-group">

      <label>
        👤 Nama Murid
      </label>

      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
        autocomplete="name"
      >

    </div>


    <!-- KELAS -->

    <div class="form-group">

      <label>
        🏫 Kelas
      </label>

      <select id="kelas">

        <option value="">
          Pilih kelas
        </option>

      <label for="kelas">Kelas</label>

<select id="kelas">
  <option value="">Pilih Kelas</option>
  <option value="Kelas 1">Kelas 1</option>
  <option value="Kelas 2">Kelas 2</option>
  <option value="Kelas 3">Kelas 3</option>
  <option value="Kelas 4">Kelas 4</option>
  <option value="Kelas 5">Kelas 5</option>
  <option value="Kelas 6">Kelas 6</option>
</select>
        </optgroup>

      </select>

    </div>


    <!-- KAMERA -->

    <div class="camera-title">

      <span>
        📷 Foto Selfie
      </span>

      <span
        class="camera-status"
        id="cameraStatus"
      >
        ● Kamera aktif
      </span>

    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
      ></video>

      <div class="camera-overlay">
        Pastikan wajah terlihat jelas
      </div>

    </div>


    <canvas id="canvas"></canvas>


    <img
      id="preview"
      class="preview"
      alt="Preview selfie"
    >


    <button
      class="masuk"
      id="masukBtn"
      onclick="ambilFoto('masuk')"
      disabled
    >
      🟢 ABSEN MASUK
    </button>


    <button
      class="pulang"
      id="pulangBtn"
      onclick="ambilFoto('pulang')"
      disabled
    >
      🔴 ABSEN PULANG
    </button>


    <div
      id="status"
      class="status"
    ></div>


    <div class="footer">
      Sistem Absensi Murid
    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABEL
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");

let fotoBlob = null;

let sedangMengirim = false;


/* =====================================================
   WAKTU WIB
===================================================== */

function waktuWIB() {

  const sekarang = new Date();

  const formatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Jakarta",

        year: "numeric",
        month: "2-digit",
        day: "2-digit",

        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",

        hour12: false
      }
    );

  const bagian =
    formatter.formatToParts(sekarang);

  const nilai = {};

  bagian.forEach(function(item) {
    nilai[item.type] =
      item.value;
  });

  return {

    tanggal:
      nilai.year +
      "-" +
      nilai.month +
      "-" +
      nilai.day,

    jam:
      nilai.hour +
      ":" +
      nilai.minute +
      ":" +
      nilai.second
  };
}


/* =====================================================
   TANGGAL
===================================================== */

function tampilkanTanggal() {

  const sekarang =
    new Date();

  const tanggal =
    sekarang.toLocaleDateString(
      "id-ID",
      {
        timeZone: "Asia/Jakarta",

        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  document.getElementById(
    "tanggal"
  ).textContent =
    "📅 " + tanggal;
}

tampilkanTanggal();


/* =====================================================
   KAMERA
===================================================== */

async function mulaiKamera() {

  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: "user",

            width: {
              ideal: 720
            },

            height: {
              ideal: 960
            }
          },

          audio: false

        });

    video.srcObject =
      stream;

    document.getElementById(
      "cameraStatus"
    ).textContent =
      "● Kamera aktif";

    document.getElementById(
      "masukBtn"
    ).disabled = false;

    document.getElementById(
      "pulangBtn"
    ).disabled = false;

  } catch (error) {

    console.error(error);

    document.getElementById(
      "cameraStatus"
    ).textContent =
      "● Kamera gagal";

    tampilkanStatus(
      "❌ Izinkan akses kamera pada browser.",
      "error"
    );
  }
}


/* =====================================================
   AMBIL FOTO
===================================================== */

function ambilFoto(jenis) {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();

  const kelas =
    document.getElementById(
      "kelas"
    ).value;

  if (nama.length < 2) {

    tampilkanStatus(
      "⚠️ Masukkan nama terlebih dahulu.",
      "error"
    );

    return;
  }

  if (!kelas) {

    tampilkanStatus(
      "⚠️ Pilih kelas terlebih dahulu.",
      "error"
    );

    return;
  }

  if (sedangMengirim) {
    return;
  }


  const context =
    canvas.getContext("2d");

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  if (!width || !height) {

    tampilkanStatus(
      "⚠️ Kamera belum siap.",
      "error"
    );

    return;
  }


  canvas.width =
    width;

  canvas.height =
    height;


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  canvas.toBlob(
    function(blob) {

      fotoBlob =
        blob;

      preview.src =
        URL.createObjectURL(blob);

      preview.style.display =
        "block";

      kirimAbsensi(jenis);

    },
    "image/jpeg",
    0.8
  );
}


/* =====================================================
   KIRIM ABSENSI
===================================================== */

async function kirimAbsensi(jenis) {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();

  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  sedangMengirim =
    true;


  document.getElementById(
    "masukBtn"
  ).disabled = true;

  document.getElementById(
    "pulangBtn"
  ).disabled = true;


  tampilkanStatus(
    "📤 Mengirim absensi...",
    "success"
  );


  try {

    const waktu =
      waktuWIB();


    const tanggal =
      waktu.tanggal;

    const jam =
      waktu.jam;


    /* NAMA FILE */

    const namaFile =
      nama
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "-"
        )
        .replace(
          /^-|-$/g,
          ""
        );


    const filePath =
      tanggal +
      "/" +
      namaFile +
      "-" +
      jenis +
      "-" +
      Date.now() +
      ".jpg";


    /* UPLOAD FOTO */

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("selfies_murid")
        .upload(
          filePath,
          fotoBlob,
          {
            contentType:
              "image/jpeg",

            upsert:
              false
          }
        );


    if (uploadError) {
      throw uploadError;
    }


    /* SIMPAN DATA */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("absensi_murid")
        .insert({

          nama:
            nama,

          kelas:
            kelas,

          tanggal:
            tanggal,

          jam:
            jam,

          jenis:
            jenis,

          foto_path:
            filePath
        });


    /* JIKA DATABASE GAGAL */

    if (insertError) {

      await supabaseClient
        .storage
        .from("selfies_murid")
        .remove([
          filePath
        ]);

      throw insertError;
    }


    /* BERHASIL */

    tampilkanStatus(
      jenis === "masuk"
        ? "✅ Absen masuk berhasil!"
        : "✅ Absen pulang berhasil!",
      "success"
    );


    fotoBlob =
      null;

    preview.style.display =
      "none";

    document.getElementById(
      "nama"
    ).value = "";

    document.getElementById(
      "kelas"
    ).value = "";


  } catch (error) {

    console.error(error);

    tampilkanStatus(
      "❌ " + error.message,
      "error"
    );
  }


  sedangMengirim =
    false;


  document.getElementById(
    "masukBtn"
  ).disabled = false;

  document.getElementById(
    "pulangBtn"
  ).disabled = false;
}


/* =====================================================
   STATUS
===================================================== */

function tampilkanStatus(
  pesan,
  tipe
) {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    pesan;

  status.className =
    "status " + tipe;
}


/* =====================================================
   MULAI
===================================================== */

mulaiKamera();

</script>

</body>
</html>
