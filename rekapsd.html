<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rekap Absensi SD</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #111827;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
}

/* HEADER */

.header {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white;
    padding: 28px 20px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.header-icon {
    font-size: 42px;
}

.header h1 {
    margin: 5px 0;
    font-size: 27px;
}

.header p {
    margin: 5px 0 0;
    opacity: .9;
}

/* CARD */

.card {
    background: white;
    padding: 18px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

/* FILTER */

.filters {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
select:focus {
    border-color: #2563eb;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 13px 17px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.blue {
    background: #2563eb;
    color: white;
}

.green {
    background: #16a34a;
    color: white;
}

.gray {
    background: #64748b;
    color: white;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

/* STATISTIK */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.stat {
    background: white;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.stat-icon {
    font-size: 25px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    color: #2563eb;
    margin-top: 4px;
}

.stat-label {
    color: #64748b;
    font-size: 13px;
    margin-top: 4px;
}

/* TABEL */

.table-wrap {
    background: white;
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th {
    background: #eff6ff;
    padding: 13px;
    text-align: left;
    font-size: 13px;
    border-bottom: 2px solid #dbeafe;
}

td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
    vertical-align: middle;
}

tr:hover {
    background: #f8fafc;
}

/* STATUS */

.badge {
    display: inline-block;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: bold;
}

.masuk {
    background: #dcfce7;
    color: #166534;
}

.pulang {
    background: #fee2e2;
    color: #991b1b;
}

/* FOTO */

.foto {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid #e5e7eb;
    cursor: pointer;
}

.foto:hover {
    opacity: .8;
}

.foto-error {
    color: #dc2626;
    font-size: 12px;
}

.lihat-foto {
    display: inline-block;
    margin-top: 5px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

/* ERROR */

.error-box {
    display: none;
    background: #fee2e2;
    color: #991b1b;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 15px;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.85);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal img {
    max-width: 95%;
    max-height: 90vh;
    border-radius: 15px;
}

.close {
    position: fixed;
    top: 15px;
    right: 20px;
    color: white;
    font-size: 40px;
    cursor: pointer;
}

/* RESPONSIVE */

@media(max-width: 800px) {

    .filters {
        grid-template-columns: 1fr 1fr;
    }

    .filters button {
        width: 100%;
    }
}

@media(max-width: 600px) {

    body {
        padding: 10px;
    }

    .header {
        padding: 22px 10px;
    }

    .header h1 {
        font-size: 22px;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .actions {
        flex-direction: column;
    }

    .actions button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="header-icon">
            📊
        </div>

        <h1>
            REKAP ABSENSI SD
        </h1>

        <p>
            Data Absensi Masuk & Pulang
        </p>

    </div>


    <!-- ERROR -->

    <div
        id="errorBox"
        class="error-box">
    </div>


    <!-- FILTER -->

    <div class="card">

        <div class="filters">

            <div>

                <label>
                    Tanggal
                </label>

                <input
                    type="date"
                    id="tanggal">

            </div>


            <div>

                <label>
                    Kelas
                </label>

                <select id="kelas">

                    <option value="">
                        Semua Kelas
                    </option>

                    <option value="Kelas 1">
                        Kelas 1
                    </option>

                    <option value="Kelas 2">
                        Kelas 2
                    </option>

                    <option value="Kelas 3">
                        Kelas 3
                    </option>

                    <option value="Kelas 4">
                        Kelas 4
                    </option>

                    <option value="Kelas 5">
                        Kelas 5
                    </option>

                    <option value="Kelas 6">
                        Kelas 6
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Cari Nama
                </label>

                <input
                    type="text"
                    id="cari"
                    placeholder="Ketik nama...">

            </div>


            <div>

                <label>
                    &nbsp;
                </label>

                <button
                    class="blue"
                    onclick="ambilData()">

                    🔄 REFRESH

                </button>

            </div>

        </div>


        <div class="actions">

            <button
                class="green"
                onclick="downloadCSV()">

                📥 DOWNLOAD CSV

            </button>


            <button
                class="gray"
                onclick="resetFilter()">

                ↩️ RESET

            </button>

        </div>

    </div>


    <!-- STATISTIK -->

    <div class="stats">

        <div class="stat">

            <div class="stat-icon">
                👥
            </div>

            <div
                class="stat-number"
                id="jumlahOrang">

                0

            </div>

            <div class="stat-label">
                Siswa
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🟢
            </div>

            <div
                class="stat-number"
                id="jumlahMasuk">

                0

            </div>

            <div class="stat-label">
                Absen Masuk
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🔴
            </div>

            <div
                class="stat-number"
                id="jumlahPulang">

                0

            </div>

            <div class="stat-label">
                Absen Pulang
            </div>

        </div>

    </div>


    <!-- TABEL -->

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        No
                    </th>

                    <th>
                        Nama
                    </th>

                    <th>
                        Kelas
                    </th>

                    <th>
                        Tanggal
                    </th>

                    <th>
                        Jam
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Foto
                    </th>

                </tr>

            </thead>


            <tbody id="tabelData">

                <tr>

                    <td
                        colspan="7"
                        class="loading">

                        ⏳ Memuat data...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- MODAL FOTO -->

<div
    class="modal"
    id="modal"
    onclick="tutupFoto()">

    <span
        class="close"
        onclick="tutupFoto()">

        ×

    </span>

    <img
        id="fotoBesar"
        src=""
        onclick="event.stopPropagation()">

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   DATA
===================================================== */

let semuaData = [];


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

    const sekarang =
        new Date();

    const tahun =
        sekarang.getFullYear();

    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(2, "0");

    const hari =
        String(
            sekarang.getDate()
        ).padStart(2, "0");

    return (
        tahun +
        "-" +
        bulan +
        "-" +
        hari
    );
}


document.getElementById("tanggal")
    .value =
    tanggalHariIni();


/* =====================================================
   AMBIL DATA
===================================================== */

async function ambilData() {

    tampilkanError("");

    document.getElementById(
        "tabelData"
    ).innerHTML = `
        <tr>
            <td
                colspan="7"
                class="loading">

                ⏳ Mengambil data absensi...

            </td>
        </tr>
    `;


    try {

        const hasil =
            await supabaseClient
                .from("absensi_sd")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (hasil.error) {

            throw hasil.error;

        }


        semuaData =
            hasil.data || [];


        tampilkanData();


    } catch (error) {

        console.error(
            "ERROR DATABASE:",
            error
        );


        tampilkanError(
            "Gagal mengambil data: " +
            error.message
        );


        document.getElementById(
            "tabelData"
        ).innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="loading">

                    ❌ Data tidak dapat dimuat.

                </td>
            </tr>
        `;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

async function tampilkanData() {

    const tanggal =
        document.getElementById(
            "tanggal"
        ).value;


    const kelas =
        document.getElementById(
            "kelas"
        ).value;


    const kata =
        document.getElementById(
            "cari"
        ).value
            .trim()
            .toLowerCase();


    const data =
        semuaData.filter(
            item => {

                let tanggalItem = "";


                if (
                    item.created_at
                ) {

                    tanggalItem =
                        item.created_at
                            .substring(
                                0,
                                10
                            );

                }


                const cocokTanggal =
                    !tanggal ||
                    tanggalItem === tanggal;


                const nama =
                    String(
                        item.nama || ""
                    ).toLowerCase();


                const cocokNama =
                    !kata ||
                    nama.includes(kata);


                const cocokKelas =
                    !kelas ||
                    String(
                        item.kelas || ""
                    ) === kelas;


                return (
                    cocokTanggal &&
                    cocokNama &&
                    cocokKelas
                );

            }
        );


    /* STATISTIK */

    const namaUnik =
        new Set(
            data.map(
                item =>
                    String(
                        item.nama || ""
                    ).toLowerCase()
            )
        );


    const masuk =
        data.filter(
            item =>
                String(
                    item.jenis || ""
                ).toLowerCase() ===
                "masuk"
        );


    const pulang =
        data.filter(
            item =>
                String(
                    item.jenis || ""
                ).toLowerCase() ===
                "pulang"
        );


    document.getElementById(
        "jumlahOrang"
    ).textContent =
        namaUnik.size;


    document.getElementById(
        "jumlahMasuk"
    ).textContent =
        masuk.length;


    document.getElementById(
        "jumlahPulang"
    ).textContent =
        pulang.length;


    /* DATA KOSONG */

    if (
        data.length === 0
    ) {

        document.getElementById(
            "tabelData"
        ).innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="loading">

                    📭 Tidak ada data absensi.

                </td>
            </tr>
        `;

        return;

    }


    /* BUAT BARIS */

    const hasilBaris = [];


    for (
        let index = 0;
        index < data.length;
        index++
    ) {

        const item =
            data[index];


        let fotoHTML =
            `<span class="foto-error">
                Tidak ada foto
             </span>`;


        /*
          FOTO HANYA DICOBA
          JIKA FOTO_PATH ADA
        */

        if (
            item.foto_path &&
            String(
                item.foto_path
            ).trim() !== ""
        ) {

            try {

                const hasilFoto =
                    await supabaseClient
                        .storage
                        .from("selfie3")
                        .createSignedUrl(
                            String(
                                item.foto_path
                            ),
                            3600
                        );


                if (
                    !hasilFoto.error &&
                    hasilFoto.data &&
                    hasilFoto.data.signedUrl
                ) {

                    const url =
                        hasilFoto.data.signedUrl;


                    const encoded =
                        encodeURIComponent(
                            url
                        );


                    fotoHTML = `
                        <div>

                            <img
                                class="foto"
                                src="${url}"
                                alt="Foto selfie"
                                onclick="bukaFoto('${encoded}')">

                            <br>

                            <a
                                class="lihat-foto"
                                href="${url}"
                                target="_blank">

                                👁️ Lihat

                            </a>

                        </div>
                    `;

                }

            } catch (error) {

                console.error(
                    "Foto error:",
                    error
                );

            }

        }


        /* JAM */

        let jam =
            "-";


        if (
            item.created_at
        ) {

            try {

                const waktu =
                    new Date(
                        item.created_at
                    );


                jam =
                    waktu.toLocaleTimeString(
                        "id-ID",
                        {
                            timeZone:
                                "Asia/Jakarta",

                            hour:
                                "2-digit",

                            minute:
                                "2-digit",

                            second:
                                "2-digit"
                        }
                    );

            } catch (error) {

                jam =
                    "-";

            }

        }


        /* TANGGAL */

        let tanggalTampil =
            "-";


        if (
            item.created_at
        ) {

            const bagian =
                item.created_at
                    .substring(
                        0,
                        10
                    )
                    .split("-");


            if (
                bagian.length === 3
            ) {

                tanggalTampil =
                    bagian[2] +
                    "-" +
                    bagian[1] +
                    "-" +
                    bagian[0];

            }

        }


        /* STATUS */

        const jenis =
            String(
                item.jenis || ""
            ).toLowerCase();


        let statusHTML;


        if (
            jenis === "masuk"
        ) {

            statusHTML = `
                <span
                    class="badge masuk">

                    🟢 MASUK

                </span>
            `;

        } else {

            statusHTML = `
                <span
                    class="badge pulang">

                    🔴 PULANG

                </span>
            `;

        }


        /* BARIS */

        hasilBaris.push(`

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <strong>
                        ${escapeHTML(
                            item.nama || "-"
                        )}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(
                        item.kelas || "-"
                    )}
                </td>

                <td>
                    ${tanggalTampil}
                </td>

                <td>
                    ${jam}
                </td>

                <td>
                    ${statusHTML}
                </td>

                <td>
                    ${fotoHTML}
                </td>

            </tr>

        `);

    }


    document.getElementById(
        "tabelData"
    ).innerHTML =
        hasilBaris.join("");

}


/* =====================================================
   FOTO BESAR
===================================================== */

function bukaFoto(
    encodedURL
) {

    const url =
        decodeURIComponent(
            encodedURL
        );


    document.getElementById(
        "fotoBesar"
    ).src =
        url;


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


function tutupFoto() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";


    document.getElementById(
        "fotoBesar"
    ).src =
        "";

}


/* =====================================================
   FILTER
===================================================== */

document.getElementById(
    "tanggal"
).addEventListener(
    "change",
    tampilkanData
);


document.getElementById(
    "kelas"
).addEventListener(
    "change",
    tampilkanData
);


document.getElementById(
    "cari"
).addEventListener(
    "input",
    tampilkanData
);


/* =====================================================
   RESET
===================================================== */

function resetFilter() {

    document.getElementById(
        "tanggal"
    ).value =
        tanggalHariIni();


    document.getElementById(
        "kelas"
    ).value =
        "";


    document.getElementById(
        "cari"
    ).value =
        "";


    tampilkanData();

}


/* =====================================================
   DOWNLOAD CSV
===================================================== */

function downloadCSV() {

    const tanggal =
        document.getElementById(
            "tanggal"
        ).value;


    const kelas =
        document.getElementById(
            "kelas"
        ).value;


    const kata =
        document.getElementById(
            "cari"
        ).value
            .trim()
            .toLowerCase();


    const data =
        semuaData.filter(
            item => {

                const tanggalItem =
                    item.created_at
                        ? item.created_at
                            .substring(
                                0,
                                10
                            )
                        : "";


                const nama =
                    String(
                        item.nama || ""
                    ).toLowerCase();


                return (

                    (!tanggal ||
                        tanggalItem ===
                        tanggal)

                    &&

                    (!kelas ||
                        String(
                            item.kelas || ""
                        ) === kelas)

                    &&

                    (!kata ||
                        nama.includes(
                            kata
                        ))

                );

            }
        );


    if (
        data.length === 0
    ) {

        alert(
            "Tidak ada data untuk didownload."
        );

        return;

    }


    let csv =
        "No,Nama,Kelas,Tanggal,Jam,Jenis,Foto Path\n";


    data.forEach(
        (item, index) => {

            let tanggal =
                item.created_at
                    ? item.created_at
                        .substring(
                            0,
                            10
                        )
                    : "";


            let jam = "";


            if (
                item.created_at
            ) {

                jam =
                    new Date(
                        item.created_at
                    ).toLocaleTimeString(
                        "id-ID",
                        {
                            timeZone:
                                "Asia/Jakarta"
                        }
                    );

            }


            const nama =
                String(
                    item.nama || ""
                ).replace(
                    /"/g,
                    '""'
                );


            const kelas =
                String(
                    item.kelas || ""
                ).replace(
                    /"/g,
                    '""'
                );


            const jenis =
                String(
                    item.jenis || ""
                ).replace(
                    /"/g,
                    '""'
                );


            const foto =
                String(
                    item.foto_path || ""
                ).replace(
                    /"/g,
                    '""'
                );


            csv +=
                (index + 1) +
                ',"' +
                nama +
                '","' +
                kelas +
                '",' +
                tanggal +
                ',"' +
                jam +
                '","' +
                jenis +
                '","' +
                foto +
                '"\n';

        }
    );


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "rekap-absensi-sd.csv";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
    pesan
) {

    const box =
        document.getElementById(
            "errorBox"
        );


    if (!pesan) {

        box.style.display =
            "none";

        box.textContent =
            "";

        return;

    }


    box.textContent =
        pesan;


    box.style.display =
        "block";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MULAI
===================================================== */

ambilData();

</script>

</body>
</html>
