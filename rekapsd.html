<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rekap Absensi SD</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#111827;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:28px 20px;
    border-radius:20px;
    text-align:center;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:8px 0 0;
    opacity:.9;
}

/* FILTER */

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:12px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    outline:none;
    background:white;
}

input:focus,
select:focus{
    border-color:#2563eb;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

/* STATISTIK */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat-number{
    font-size:28px;
    font-weight:bold;
    color:#2563eb;
}

.stat-label{
    margin-top:5px;
    color:#64748b;
}

/* TABLE */

.table-wrap{
    background:white;
    border-radius:18px;
    padding:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#f8fafc;
    padding:14px;
    text-align:left;
    border-bottom:2px solid #e5e7eb;
    font-size:14px;
}

td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    font-size:14px;
    vertical-align:middle;
}

tr:hover{
    background:#f8fafc;
}

/* STATUS */

.badge{
    display:inline-block;
    padding:7px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.masuk{
    background:#dcfce7;
    color:#166534;
}

.pulang{
    background:#fee2e2;
    color:#991b1b;
}

/* FOTO */

.foto{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #e5e7eb;
    cursor:pointer;
}

.foto:hover{
    opacity:.8;
}

.lihat-foto{
    display:inline-block;
    margin-top:6px;
    padding:6px 9px;
    border-radius:7px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    font-size:11px;
}

.tidak-ada{
    color:#94a3b8;
    font-size:12px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
}

/* ERROR */

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal img{
    max-width:95%;
    max-height:90vh;
    border-radius:15px;
}

.close{
    position:fixed;
    top:15px;
    right:25px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:23px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>📊 REKAP ABSENSI SD</h1>

        <p>
            Data Absensi Masuk & Pulang
        </p>

    </div>


    <!-- ERROR -->

    <div
        id="errorBox"
        class="error">
    </div>


    <!-- FILTER -->

    <div class="card">

        <div class="filters">

            <div>

                <label>Tanggal</label>

                <input
                    type="date"
                    id="tanggal"
                    onchange="tampilkanData()">

            </div>


            <div>

                <label>Kelas</label>

                <select
                    id="kelas"
                    onchange="tampilkanData()">

                    <option value="">
                        Semua Kelas
                    </option>

                    <option value="Kelas 1">
                        Kelas 1
                    </option>

                    <option value="Kelas 2">
                        Kelas 2
                    </option>

                    <option value="Kelas 3">
                        Kelas 3
                    </option>

                    <option value="Kelas 4">
                        Kelas 4
                    </option>

                    <option value="Kelas 5">
                        Kelas 5
                    </option>

                    <option value="Kelas 6">
                        Kelas 6
                    </option>

                </select>

            </div>


            <div>

                <label>Cari Nama</label>

                <input
                    type="text"
                    id="cari"
                    placeholder="Ketik nama..."
                    oninput="tampilkanData()">

            </div>


            <div>

                <label>&nbsp;</label>

                <button
                    onclick="ambilData()">

                    🔄 Refresh

                </button>

            </div>

        </div>

    </div>


    <!-- STATISTIK -->

    <div class="stats">

        <div class="stat">

            <div class="stat-number"
                 id="jumlahSiswa">
                0
            </div>

            <div class="stat-label">
                Total Absensi
            </div>

        </div>


        <div class="stat">

            <div class="stat-number"
                 id="jumlahMasuk">
                0
            </div>

            <div class="stat-label">
                🟢 Masuk
            </div>

        </div>


        <div class="stat">

            <div class="stat-number"
                 id="jumlahPulang">
                0
            </div>

            <div class="stat-label">
                🔴 Pulang
            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>No</th>

                    <th>Nama</th>

                    <th>Kelas</th>

                    <th>Tanggal</th>

                    <th>Jam</th>

                    <th>Status</th>

                    <th>Foto</th>

                </tr>

            </thead>


            <tbody id="tabelData">

                <tr>

                    <td
                        colspan="7"
                        class="loading">

                        ⏳ Memuat data...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- MODAL FOTO -->

<div
    class="modal"
    id="modal"
    onclick="tutupFoto()">

    <span
        class="close"
        onclick="tutupFoto()">

        ×

    </span>


    <img
        id="fotoBesar"
        src=""
        onclick="event.stopPropagation()">

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABEL
===================================================== */

let semuaData = [];


/* =====================================================
   TANGGAL HARI INI
   MENGGUNAKAN WAKTU INDONESIA
===================================================== */

function tanggalHariIni(){

    const sekarang =
        new Date();

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:"Asia/Jakarta",
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        );

    return formatter.format(
        sekarang
    );
}


document.getElementById(
    "tanggal"
).value =
tanggalHariIni();


/* =====================================================
   FORMAT WAKTU WIB
===================================================== */

function formatTanggalWIB(
    createdAt
){

    if(!createdAt){
        return "-";
    }

    const tanggal =
        new Date(createdAt);

    return new Intl.DateTimeFormat(
        "id-ID",
        {
            timeZone:"Asia/Jakarta",
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ).format(tanggal);

}


function formatJamWIB(
    createdAt
){

    if(!createdAt){
        return "-";
    }

    const tanggal =
        new Date(createdAt);

    return new Intl.DateTimeFormat(
        "id-ID",
        {
            timeZone:"Asia/Jakarta",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    ).format(tanggal);

}


/* =====================================================
   FORMAT TANGGAL UNTUK FILTER
===================================================== */

function tanggalFilterWIB(
    createdAt
){

    if(!createdAt){
        return "";
    }

    const tanggal =
        new Date(createdAt);

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:"Asia/Jakarta",
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        );

    return formatter.format(
        tanggal
    );

}


/* =====================================================
   AMBIL DATA
===================================================== */

async function ambilData(){

    tampilkanError("");

    document.getElementById(
        "tabelData"
    ).innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading">

                ⏳ Memuat data...

            </td>

        </tr>

    `;


    try{

        const hasil =
            await supabaseClient
            .from("absensi_sd")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(hasil.error){

            throw hasil.error;

        }


        semuaData =
            hasil.data || [];


        console.log(
            "Data absensi:",
            semuaData
        );


        tampilkanData();


    }catch(error){

        console.error(
            error
        );


        tampilkanError(
            "Gagal mengambil data: " +
            error.message
        );


        document.getElementById(
            "tabelData"
        ).innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="loading">

                    ❌ Data tidak dapat dimuat.

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

async function tampilkanData(){

    const tanggal =
        document.getElementById(
            "tanggal"
        ).value;


    const kelas =
        document.getElementById(
            "kelas"
        ).value;


    const kata =
        document.getElementById(
            "cari"
        ).value
        .trim()
        .toLowerCase();


    const data =
        semuaData.filter(
            item => {

                const cocokTanggal =
                    !tanggal ||
                    tanggalFilterWIB(
                        item.created_at
                    ) === tanggal;


                const cocokKelas =
                    !kelas ||
                    String(
                        item.kelas || ""
                    ) === kelas;


                const cocokNama =
                    !kata ||
                    String(
                        item.nama || ""
                    )
                    .toLowerCase()
                    .includes(kata);


                return (
                    cocokTanggal &&
                    cocokKelas &&
                    cocokNama
                );

            }
        );


    /* STATISTIK */

    document.getElementById(
        "jumlahSiswa"
    ).textContent =
        data.length;


    document.getElementById(
        "jumlahMasuk"
    ).textContent =
        data.filter(
            item =>
                String(
                    item.jenis || ""
                ).toLowerCase()
                === "masuk"
        ).length;


    document.getElementById(
        "jumlahPulang"
    ).textContent =
        data.filter(
            item =>
                String(
                    item.jenis || ""
                ).toLowerCase()
                === "pulang"
        ).length;


    /* DATA KOSONG */

    if(data.length === 0){

        document.getElementById(
            "tabelData"
        ).innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="loading">

                    📭 Belum ada data absensi.

                </td>

            </tr>

        `;

        return;

    }


    /* BUAT BARIS */

    const baris =
        await Promise.all(

            data.map(
                async (
                    item,
                    index
                ) => {


                    /* FOTO */

                    let fotoHTML =
                        `<span class="tidak-ada">
                            Tidak ada foto
                         </span>`;


                    if(
                        item.foto_path
                    ){

                        try{

                            const hasil =
                                await supabaseClient
                                .storage
                                .from("selfie3")
                                .createSignedUrl(
                                    item.foto_path,
                                    3600
                                );


                            if(
                                hasil.data &&
                                hasil.data.signedUrl
                            ){

                                const url =
                                    hasil.data.signedUrl;


                                const encoded =
                                    encodeURIComponent(
                                        url
                                    );


                                fotoHTML = `

                                    <div>

                                        <img
                                            class="foto"
                                            src="${url}"
                                            alt="Foto absensi"
                                            onclick="bukaFoto('${encoded}')">

                                        <br>

                                        <a
                                            class="lihat-foto"
                                            href="${url}"
                                            target="_blank">

                                            👁️ Lihat Foto

                                        </a>

                                    </div>

                                `;

                            }

                        }catch(error){

                            console.error(
                                "Foto error:",
                                error
                            );

                        }

                    }


                    /* STATUS */

                    const jenis =
                        String(
                            item.jenis || ""
                        ).toLowerCase();


                    let statusHTML;


                    if(
                        jenis === "masuk"
                    ){

                        statusHTML = `

                            <span
                                class="badge masuk">

                                🟢 MASUK

                            </span>

                        `;

                    }else{

                        statusHTML = `

                            <span
                                class="badge pulang">

                                🔴 PULANG

                            </span>

                        `;

                    }


                    /* BARIS */

                    return `

                        <tr>

                            <td>
                                ${index + 1}
                            </td>


                            <td>

                                <strong>
                                    ${escapeHTML(
                                        item.nama || "-"
                                    )}
                                </strong>

                            </td>


                            <td>

                                ${escapeHTML(
                                    item.kelas || "-"
                                )}

                            </td>


                            <td>

                                ${formatTanggalWIB(
                                    item.created_at
                                )}

                            </td>


                            <td>

                                <strong>
                                    ${formatJamWIB(
                                        item.created_at
                                    )}
                                </strong>

                            </td>


                            <td>

                                ${statusHTML}

                            </td>


                            <td>

                                ${fotoHTML}

                            </td>

                        </tr>

                    `;

                }
            )

        );


    document.getElementById(
        "tabelData"
    ).innerHTML =
        baris.join("");

}


/* =====================================================
   BUKA FOTO BESAR
===================================================== */

function bukaFoto(
    encodedURL
){

    const url =
        decodeURIComponent(
            encodedURL
        );


    document.getElementById(
        "fotoBesar"
    ).src =
        url;


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


function tutupFoto(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";


    document.getElementById(
        "fotoBesar"
    ).src =
        "";

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
    pesan
){

    const box =
        document.getElementById(
            "errorBox"
        );


    if(!pesan){

        box.style.display =
            "none";

        box.textContent =
            "";

        return;

    }


    box.textContent =
        pesan;

    box.style.display =
        "block";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MULAI
===================================================== */

ambilData();

</script>

</body>
</html>
