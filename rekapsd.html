<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RekapSD - SD Warnasari</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 15px;

      font-family: Arial, sans-serif;

      background: #f1f5f9;

      color: #111827;

    }


    .container {

      width: 100%;

      max-width: 1150px;

      margin: auto;

    }


    /* =========================
       HEADER
    ========================= */

    .header {

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e3a8a
        );

      color: white;

      padding: 25px 20px;

      border-radius: 20px;

      text-align: center;

      margin-bottom: 15px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.10);

    }


    .header-icon {

      font-size: 45px;

    }


    .header h1 {

      margin: 5px 0;

      font-size: 27px;

    }


    .header p {

      margin: 5px 0 0;

      opacity: .85;

      font-size: 14px;

    }


    /* =========================
       ERROR
    ========================= */

    .error {

      display: none;

      background: #fee2e2;

      color: #991b1b;

      padding: 13px;

      border-radius: 10px;

      margin-bottom: 15px;

      font-weight: bold;

    }


    /* =========================
       CARD
    ========================= */

    .card {

      background: white;

      padding: 18px;

      border-radius: 18px;

      margin-bottom: 15px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.06);

    }


    /* =========================
       FILTER
    ========================= */

    .filters {

      display: grid;

      grid-template-columns:
        1fr
        1fr
        auto;

      gap: 10px;

    }


    label {

      display: block;

      font-size: 13px;

      font-weight: bold;

      margin-bottom: 6px;

    }


    input {

      width: 100%;

      height: 45px;

      padding: 10px 12px;

      border:
        1px solid
        #d1d5db;

      border-radius: 10px;

      font-size: 15px;

      outline: none;

    }


    input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,.10);

    }


    button {

      border: none;

      border-radius: 10px;

      padding:
        12px
        16px;

      font-weight: bold;

      cursor: pointer;

      font-size: 14px;

    }


    button:active {

      transform: scale(.98);

    }


    .blue {

      background: #2563eb;

      color: white;

    }


    .green {

      background: #16a34a;

      color: white;

    }


    .gray {

      background: #64748b;

      color: white;

    }


    /* =========================
       ACTION
    ========================= */

    .actions {

      display: flex;

      gap: 10px;

      margin-top: 12px;

      flex-wrap: wrap;

    }


    /* =========================
       STATISTIK
    ========================= */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom: 15px;

    }


    .stat {

      text-align: center;

      padding: 17px 5px;

      background: white;

      border-radius: 15px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.06);

    }


    .stat-icon {

      font-size: 25px;

    }


    .stat-number {

      font-size: 25px;

      font-weight: bold;

      margin-top: 4px;

    }


    .stat-label {

      color: #64748b;

      font-size: 12px;

      margin-top: 3px;

    }


    /* =========================
       TABLE
    ========================= */

    .table-wrap {

      background: white;

      border-radius: 18px;

      padding: 12px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.06);

      overflow-x: auto;

    }


    table {

      width: 100%;

      border-collapse: collapse;

      min-width: 850px;

    }


    th {

      background: #f8fafc;

      padding: 13px;

      text-align: left;

      font-size: 13px;

      border-bottom:
        2px solid
        #e5e7eb;

    }


    td {

      padding: 12px;

      border-bottom:
        1px solid
        #e5e7eb;

      font-size: 14px;

      vertical-align: middle;

    }


    tr:hover td {

      background: #f8fafc;

    }


    /* =========================
       STATUS
    ========================= */

    .badge {

      display: inline-block;

      padding:
        6px
        9px;

      border-radius: 8px;

      font-size: 11px;

      font-weight: bold;

    }


    .masuk {

      background: #dcfce7;

      color: #166534;

    }


    .pulang {

      background: #fee2e2;

      color: #991b1b;

    }


    /* =========================
       FOTO
    ========================= */

    .foto {

      width: 75px;

      height: 75px;

      object-fit: cover;

      border-radius: 10px;

      border:
        2px solid
        #e5e7eb;

      cursor: pointer;

      display: block;

      transition: .2s;

    }


    .foto:hover {

      opacity: .8;

      transform: scale(1.03);

    }


    .foto-box {

      width: 90px;

    }


    .foto-buttons {

      display: flex;

      gap: 5px;

      margin-top: 6px;

    }


    .foto-buttons a {

      display: inline-block;

      padding:
        6px
        8px;

      border-radius: 7px;

      color: white;

      text-decoration: none;

      font-size: 11px;

      font-weight: bold;

    }


    .lihat {

      background: #2563eb;

    }


    .download {

      background: #16a34a;

    }


    .foto-error {

      color: #dc2626;

      font-size: 11px;

    }


    .foto-tidakada {

      color: #94a3b8;

      font-size: 11px;

    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      text-align: center;

      padding: 35px;

      color: #64748b;

    }


    /* =========================
       MODAL
    ========================= */

    .modal {

      display: none;

      position: fixed;

      z-index: 9999;

      inset: 0;

      background:
        rgba(0,0,0,.88);

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    .modal img {

      max-width: 95%;

      max-height: 85vh;

      border-radius: 15px;

      object-fit: contain;

    }


    .close {

      position: fixed;

      top: 10px;

      right: 20px;

      color: white;

      font-size: 42px;

      cursor: pointer;

      line-height: 1;

    }


    .modal-download {

      position: fixed;

      bottom: 20px;

      left: 50%;

      transform: translateX(-50%);

      background: #16a34a;

      color: white;

      padding:
        12px
        18px;

      border-radius: 10px;

      text-decoration: none;

      font-weight: bold;

    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width: 650px) {

      body {

        padding: 10px;

      }


      .header {

        padding: 20px 10px;

      }


      .header h1 {

        font-size: 23px;

      }


      .filters {

        grid-template-columns: 1fr;

      }


      .filters button {

        width: 100%;

      }


      .stats {

        gap: 7px;

      }


      .stat {

        padding: 13px 3px;

      }


      .stat-icon {

        font-size: 20px;

      }


      .stat-number {

        font-size: 21px;

      }


      .stat-label {

        font-size: 10px;

      }


      .actions {

        flex-direction: column;

      }


      .actions button {

        width: 100%;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="header-icon">
      📊
    </div>

    <h1>
      REKAP ABSENSI SD
    </h1>

    <p>
      SD WARNASARI • KELAS 6
    </p>

  </div>


  <!-- ERROR -->

  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- FILTER -->

  <div class="card">

    <div class="filters">


      <!-- TANGGAL -->

      <div>

        <label>
          Tanggal
        </label>

        <input
          type="date"
          id="tanggal"
          onchange="tampilkanData()"
        >

      </div>


      <!-- CARI -->

      <div>

        <label>
          Cari Nama
        </label>

        <input
          type="text"
          id="cari"
          placeholder="Ketik nama..."
          oninput="tampilkanData()"
        >

      </div>


      <!-- REFRESH -->

      <div>

        <label>
          &nbsp;
        </label>

        <button
          class="blue"
          onclick="ambilData()"
        >
          🔄 REFRESH
        </button>

      </div>


    </div>


    <!-- ACTION -->

    <div class="actions">

      <button
        class="green"
        onclick="downloadCSV()"
      >
        📥 DOWNLOAD CSV
      </button>


      <button
        class="gray"
        onclick="resetFilter()"
      >
        ↩️ RESET
      </button>

    </div>

  </div>


  <!-- STATISTIK -->

  <div class="stats">


    <div class="stat">

      <div class="stat-icon">
        👥
      </div>

      <div
        class="stat-number"
        id="jumlahOrang"
      >
        0
      </div>

      <div class="stat-label">
        Orang
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🟢
      </div>

      <div
        class="stat-number"
        id="jumlahMasuk"
      >
        0
      </div>

      <div class="stat-label">
        Absen Masuk
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🔴
      </div>

      <div
        class="stat-number"
        id="jumlahPulang"
      >
        0
      </div>

      <div class="stat-label">
        Absen Pulang
      </div>

    </div>


  </div>


  <!-- TABEL -->

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>
            No
          </th>

          <th>
            Nama
          </th>

          <th>
            Kelas
          </th>

          <th>
            Tanggal
          </th>

          <th>
            Jam
          </th>

          <th>
            Status
          </th>

          <th>
            Foto Selfie
          </th>

        </tr>

      </thead>


      <tbody
        id="tabelData"
      >

        <tr>

          <td
            colspan="7"
            class="loading"
          >
            ⏳ Memuat data...
          </td>

        </tr>

      </tbody>

    </table>

  </div>


</div>


<!-- MODAL FOTO -->

<div
  class="modal"
  id="modal"
  onclick="tutupModal()"
>

  <span
    class="close"
    onclick="tutupModal()"
  >
    ×
  </span>


  <img
    id="fotoBesar"
    src=""
    alt="Foto selfie"
    onclick="event.stopPropagation()"
  >


  <a
    id="downloadModal"
    class="modal-download"
    href="#"
    target="_blank"
    download
    onclick="event.stopPropagation()"
  >
    📥 DOWNLOAD FOTO
  </a>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   SETTING
===================================================== */

const BUCKET_FOTO =
  "selfie3";


const NAMA_TABEL =
  "absensi_sd";


/* =====================================================
   VARIABEL
===================================================== */

let semuaData = [];


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

  const sekarang =
    new Date();


  const tahun =
    sekarang.getFullYear();


  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const hari =
    String(
      sekarang.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    tahun +
    "-" +
    bulan +
    "-" +
    hari
  );

}


/* =====================================================
   SET TANGGAL AWAL
===================================================== */

document.getElementById(
  "tanggal"
).value =
  tanggalHariIni();


/* =====================================================
   AMBIL DATA
===================================================== */

async function ambilData() {

  tampilkanError("");


  document.getElementById(
    "tabelData"
  ).innerHTML = `

    <tr>

      <td
        colspan="7"
        class="loading"
      >
        ⏳ Memuat data...
      </td>

    </tr>

  `;


  try {


    const hasil =
      await supabaseClient
        .from(
          NAMA_TABEL
        )
        .select("*");


    if (
      hasil.error
    ) {

      throw hasil.error;

    }


    semuaData =
      hasil.data || [];


    /* =================================================
       URUTKAN DATA TERBARU
    ================================================= */

    semuaData.sort(
      function(a, b) {

        const waktuA =
          String(
            a.tanggal || ""
          ) +
          String(
            a.jam || ""
          );


        const waktuB =
          String(
            b.tanggal || ""
          ) +
          String(
            b.jam || ""
          );


        return waktuB.localeCompare(
          waktuA
        );

      }
    );


    tampilkanData();


  } catch (error) {

    console.error(
      "ERROR AMBIL DATA:",
      error
    );


    tampilkanError(
      "Gagal mengambil data: " +
      error.message
    );


    document.getElementById(
      "tabelData"
    ).innerHTML = `

      <tr>

        <td
          colspan="7"
          class="loading"
        >
          ❌ Data tidak dapat dimuat.
        </td>

      </tr>

    `;

  }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData() {


  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  /* ===================================================
     FILTER
  =================================================== */

  const data =
    semuaData.filter(
      function(item) {


        const cocokTanggal =
          !tanggal ||
          String(
            item.tanggal || ""
          ) === tanggal;


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(
            kata
          );


        const cocokKelas =
          String(
            item.kelas || ""
          ).toLowerCase() ===
          "kelas 6";


        return (
          cocokTanggal &&
          cocokNama &&
          cocokKelas
        );

      }
    );


  /* ===================================================
     STATISTIK
  =================================================== */

  const namaUnik =
    new Set(
      data.map(
        function(item) {

          return String(
            item.nama || ""
          ).toLowerCase();

        }
      )
    );


  const masuk =
    data.filter(
      function(item) {

        return String(
          item.jenis || ""
        ).toLowerCase() ===
        "masuk";

      }
    ).length;


  const pulang =
    data.filter(
      function(item) {

        return String(
          item.jenis || ""
        ).toLowerCase() ===
        "pulang";

      }
    ).length;


  document.getElementById(
    "jumlahOrang"
  ).textContent =
    namaUnik.size;


  document.getElementById(
    "jumlahMasuk"
  ).textContent =
    masuk;


  document.getElementById(
    "jumlahPulang"
  ).textContent =
    pulang;


  /* ===================================================
     DATA KOSONG
  =================================================== */

  if (
    data.length === 0
  ) {

    document.getElementById(
      "tabelData"
    ).innerHTML = `

      <tr>

        <td
          colspan="7"
          class="loading"
        >
          📭 Tidak ada data absensi Kelas 6.
        </td>

      </tr>

    `;

    return;

  }


  /* ===================================================
     BUAT BARIS
  =================================================== */

  const baris =
    data.map(
      function(item, index) {


        const jenis =
          String(
            item.jenis || ""
          ).toLowerCase();


        let status;


        if (
          jenis === "masuk"
        ) {

          status = `

            <span
              class="badge masuk"
            >
              🟢 MASUK
            </span>

          `;

        } else {

          status = `

            <span
              class="badge pulang"
            >
              🔴 PULANG
            </span>

          `;

        }


        const fotoHTML =
          buatFoto(
            item.foto_path
          );


        return `

          <tr>

            <td>
              ${index + 1}
            </td>


            <td>

              <strong>
                ${escapeHTML(
                  item.nama || "-"
                )}
              </strong>

            </td>


            <td>
              ${escapeHTML(
                item.kelas || "Kelas 6"
              )}
            </td>


            <td>
              ${formatTanggal(
                item.tanggal
              )}
            </td>


            <td>
              ${formatJam(
                item.jam
              )}
            </td>


            <td>
              ${status}
            </td>


            <td>
              ${fotoHTML}
            </td>

          </tr>

        `;

      }
    );


  document.getElementById(
    "tabelData"
  ).innerHTML =
    baris.join("");

}


/* =====================================================
   FOTO PUBLIC
===================================================== */

function buatFoto(path) {


  if (
    !path
  ) {

    return `

      <span class="foto-tidakada">
        Tidak ada foto
      </span>

    `;

  }


  try {


    /* =================================================
       BERSIHKAN PATH
    ================================================= */

    let cleanPath =
      String(path)
        .trim();


    /*
      Jika database ternyata menyimpan
      URL lengkap, ambil bagian path
      setelah nama bucket.
    */

    const posisiBucket =
      cleanPath.indexOf(
        BUCKET_FOTO + "/"
      );


    if (
      posisiBucket !== -1
    ) {

      cleanPath =
        cleanPath.substring(
          posisiBucket +
          BUCKET_FOTO.length +
          1
        );

    }


    /*
      Hilangkan slash di awal
    */

    cleanPath =
      cleanPath.replace(
        /^\/+/,
        ""
      );


    /* =================================================
       PUBLIC URL
    ================================================= */

    const hasil =
      supabaseClient
        .storage
        .from(
          BUCKET_FOTO
        )
        .getPublicUrl(
          cleanPath
        );


    const url =
      hasil.data.publicUrl;


    if (
      !url
    ) {

      return `

        <span class="foto-error">
          URL foto tidak ditemukan
        </span>

      `;

    }


    const encoded =
      encodeURIComponent(
        url
      );


    return `

      <div class="foto-box">


        <img

          class="foto"

          src="${url}"

          alt="Foto selfie"

          loading="lazy"

          onclick="
            bukaFoto('${encoded}')
          "

          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='block';
          "

        >


        <span
          class="foto-error"
          style="display:none"
        >
          Foto tidak ditemukan
        </span>


        <div class="foto-buttons">


          <a

            class="lihat"

            href="${url}"

            target="_blank"

          >
            👁️ Lihat
          </a>


          <a

            class="download"

            href="${url}"

            download

            target="_blank"

          >
            📥 Simpan
          </a>


        </div>


      </div>

    `;


  } catch (error) {


    console.error(
      "FOTO ERROR:",
      error
    );


    return `

      <span class="foto-error">
        Foto error
      </span>

    `;

  }

}


/* =====================================================
   BUKA FOTO BESAR
===================================================== */

function bukaFoto(
  encodedURL
) {


  const url =
    decodeURIComponent(
      encodedURL
    );


  document.getElementById(
    "fotoBesar"
  ).src =
    url;


  document.getElementById(
    "downloadModal"
  ).href =
    url;


  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


/* =====================================================
   TUTUP MODAL
===================================================== */

function tutupModal() {


  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "fotoBesar"
  ).src =
    "";


  document.getElementById(
    "downloadModal"
  ).href =
    "#";

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
  tanggal
) {


  if (
    !tanggal
  ) {

    return "-";

  }


  const bagian =
    String(
      tanggal
    ).split("-");


  if (
    bagian.length !== 3
  ) {

    return tanggal;

  }


  return (
    bagian[2] +
    "-" +
    bagian[1] +
    "-" +
    bagian[0]
  );

}


/* =====================================================
   FORMAT JAM
===================================================== */

function formatJam(
  jam
) {


  if (
    !jam
  ) {

    return "-";

  }


  return String(
    jam
  ).substring(
    0,
    8
  );

}


/* =====================================================
   RESET FILTER
===================================================== */

function resetFilter() {


  document.getElementById(
    "tanggal"
  ).value =
    tanggalHariIni();


  document.getElementById(
    "cari"
  ).value =
    "";


  tampilkanData();

}


/* =====================================================
   DOWNLOAD CSV
===================================================== */

function downloadCSV() {


  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  const data =
    semuaData.filter(
      function(item) {


        const cocokTanggal =
          !tanggal ||
          String(
            item.tanggal || ""
          ) === tanggal;


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(
            kata
          );


        const cocokKelas =
          String(
            item.kelas || ""
          ).toLowerCase() ===
          "kelas 6";


        return (
          cocokTanggal &&
          cocokNama &&
          cocokKelas
        );

      }
    );


  if (
    data.length === 0
  ) {

    alert(
      "Tidak ada data untuk didownload."
    );

    return;

  }


  /* =================================================
     HEADER CSV
  ================================================= */

  let csv =
    "No,Nama,Kelas,Tanggal,Jam,Jenis,Foto Path\n";


  /* =================================================
     DATA CSV
  ================================================= */

  data.forEach(
    function(item, index) {


      const nama =
        String(
          item.nama || ""
        ).replace(
          /"/g,
          '""'
        );


      const kelas =
        String(
          item.kelas || "Kelas 6"
        ).replace(
          /"/g,
          '""'
        );


      const foto =
        String(
          item.foto_path || ""
        ).replace(
          /"/g,
          '""'
        );


      csv +=

        (
          index + 1
        ) +

        ',"' +

        nama +

        '","' +

        kelas +

        '",' +

        (
          item.tanggal || ""
        ) +

        "," +

        (
          item.jam || ""
        ) +

        "," +

        (
          item.jenis || ""
        ) +

        ',"' +

        foto +

        '"\n';

    }
  );


  /* =================================================
     BUAT FILE
  ================================================= */

  const blob =
    new Blob(
      [
        "\ufeff" +
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "rekapsd.csv";


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  URL.revokeObjectURL(
    url
  );

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
  pesan
) {


  const box =
    document.getElementById(
      "errorBox"
    );


  if (
    !pesan
  ) {

    box.style.display =
      "none";

    box.textContent =
      "";

    return;

  }


  box.textContent =
    pesan;


  box.style.display =
    "block";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {


  return String(
    text
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   MULAI
===================================================== */

ambilData();
