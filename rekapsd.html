<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rekap Absensi SD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      margin: auto;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 25px 20px;
      border-radius: 0 0 20px 20px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header-icon {
      font-size: 45px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: .85;
    }

    /* CARD */
    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    /* FILTER */
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 45px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .gray {
      background: #64748b;
      color: white;
    }

    /* ACTION */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    /* STATISTIK */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat {
      background: white;
      text-align: center;
      padding: 15px 5px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .stat-icon {
      font-size: 25px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    .stat-label {
      color: #64748b;
      font-size: 12px;
      margin-top: 3px;
    }

    /* TABLE */
    .table-wrap {
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background: #f8fafc;
      padding: 13px;
      text-align: left;
      font-size: 13px;
      border-bottom: 2px solid #e5e7eb;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      vertical-align: middle;
    }

    /* STATUS */
    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
    }

    .masuk {
      background: #dcfce7;
      color: #166534;
    }

    .pulang {
      background: #fee2e2;
      color: #991b1b;
    }

    /* FOTO */
    .foto-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .foto {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #e5e7eb;
      cursor: pointer;
      display: block;
      background: #e5e7eb;
    }

    .foto:hover {
      opacity: .8;
    }

    .foto-buttons {
      display: flex;
      gap: 5px;
      margin-top: 7px;
    }

    .foto-buttons a,
    .foto-buttons button {
      padding: 6px 8px;
      border-radius: 7px;
      color: white;
      text-decoration: none;
      font-size: 11px;
      border: 0;
      cursor: pointer;
    }

    .lihat {
      background: #2563eb;
    }

    .download {
      background: #16a34a;
    }

    .foto-error {
      color: #dc2626;
      font-size: 12px;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    /* ERROR */
    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 99999;
      inset: 0;
      background: rgba(0,0,0,.88);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal img {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 15px;
      object-fit: contain;
    }

    .close {
      position: fixed;
      top: 10px;
      right: 20px;
      color: white;
      font-size: 45px;
      cursor: pointer;
    }

    /* MOBILE */
    @media(max-width: 650px) {

      body {
        padding: 10px;
      }

      .header {
        padding: 20px 10px;
      }

      .header h1 {
        font-size: 23px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .filters button {
        width: 100%;
      }

      .stats {
        gap: 7px;
      }

      .stat {
        padding: 12px 3px;
      }

      .stat-icon {
        font-size: 20px;
      }

      .stat-number {
        font-size: 20px;
      }

      .stat-label {
        font-size: 10px;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   BUCKET FOTO
===================================================== */

const NAMA_BUCKET =
  "selfie3";


/* =====================================================
   VARIABEL
===================================================== */

let semuaData = [];


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

  const sekarang = new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(2, "0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2, "0");

  return (
    tahun +
    "-" +
    bulan +
    "-" +
    hari
  );
}


document.getElementById(
  "tanggal"
).value = tanggalHariIni();


/* =====================================================
   AMBIL DATA
===================================================== */

async function ambilData() {

  tampilkanError("");

  document.getElementById(
    "tabelData"
  ).innerHTML = `
    <tr>
      <td
        colspan="7"
        class="loading"
      >
        ⏳ Mengambil data absensi...
      </td>
    </tr>
  `;


  try {

    /*
      KITA TIDAK MENGGUNAKAN FILTER TANGGAL
      DI SUPABASE.

      Semua data diambil terlebih dahulu.
    */

    const hasil =
      await supabaseClient
        .from("absensi_sd")
        .select("*");


    if (hasil.error) {
      throw hasil.error;
    }


    semuaData =
      hasil.data || [];


    console.log(
      "DATA ABSENSI:",
      semuaData
    );


    /*
      URUTKAN DATA TERBARU
    */

    semuaData.sort(
      (a, b) => {

        const waktuA =
          dapatkanTanggalWaktu(a);

        const waktuB =
          dapatkanTanggalWaktu(b);

        return (
          new Date(waktuB) -
          new Date(waktuA)
        );

      }
    );


    tampilkanData();


  } catch (error) {

    console.error(
      "ERROR SUPABASE:",
      error
    );


    tampilkanError(
      "Gagal mengambil data: " +
      error.message
    );


    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="7"
          class="loading"
        >
          ❌ Data tidak dapat dimuat.
        </td>
      </tr>
    `;
  }

}


/* =====================================================
   TANGGAL / WAKTU DATA
===================================================== */

function dapatkanTanggalWaktu(item) {

  /*
    Jika kolom tanggal tersedia
  */

  if (item.tanggal) {

    return (
      String(item.tanggal) +
      "T" +
      String(
        item.jam || "00:00:00"
      )
    );

  }


  /*
    Jika tidak ada tanggal,
    gunakan created_at
  */

  if (item.created_at) {

    return item.created_at;

  }


  return "1970-01-01T00:00:00";
}


/* =====================================================
   TANGGAL DATA
===================================================== */

function dapatkanTanggal(item) {

  if (item.tanggal) {

    return String(
      item.tanggal
    ).substring(0, 10);

  }


  if (item.created_at) {

    /*
      Ubah ke waktu Indonesia
    */

    const tanggal =
      new Date(
        item.created_at
      );


    const tahun =
      tanggal.toLocaleString(
        "en-US",
        {
          timeZone: "Asia/Jakarta",
          year: "numeric"
        }
      );

    const bulan =
      tanggal.toLocaleString(
        "en-US",
        {
          timeZone: "Asia/Jakarta",
          month: "2-digit"
        }
      );

    const hari =
      tanggal.toLocaleString(
        "en-US",
        {
          timeZone: "Asia/Jakarta",
          day: "2-digit"
        }
      );


    return (
      tahun +
      "-" +
      bulan +
      "-" +
      hari
    );

  }


  return "";
}


/* =====================================================
   JAM DATA
===================================================== */

function dapatkanJam(item) {

  if (item.jam) {

    return String(
      item.jam
    ).substring(0, 8);

  }


  if (item.created_at) {

    const tanggal =
      new Date(
        item.created_at
      );


    return tanggal.toLocaleTimeString(
      "id-ID",
      {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }
    );

  }


  return "-";
}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData() {

  const tanggalDipilih =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  /*
    HANYA KELAS 6
  */

  const data =
    semuaData.filter(
      item => {

        const kelas =
          String(
            item.kelas || ""
          )
          .trim()
          .toLowerCase();


        const cocokKelas =
          kelas === "kelas 6" ||
          kelas === "6";


        const tanggalData =
          dapatkanTanggal(item);


        const cocokTanggal =
          !tanggalDipilih ||
          tanggalData === tanggalDipilih;


        const nama =
          String(
            item.nama || ""
          )
          .toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(kata);


        return (
          cocokKelas &&
          cocokTanggal &&
          cocokNama
        );

      }
    );


  /* ===================================================
     STATISTIK
  =================================================== */

  const namaUnik =
    new Set(
      data.map(
        item =>
          String(
            item.nama || ""
          )
          .trim()
          .toLowerCase()
      )
    );


  const masuk =
    data.filter(
      item =>
        String(
          item.jenis || ""
        )
        .trim()
        .toLowerCase() === "masuk"
    ).length;


  const pulang =
    data.filter(
      item =>
        String(
          item.jenis || ""
        )
        .trim()
        .toLowerCase() === "pulang"
    ).length;


  document.getElementById(
    "jumlahOrang"
  ).textContent =
    namaUnik.size;


  document.getElementById(
    "jumlahMasuk"
  ).textContent =
    masuk;


  document.getElementById(
    "jumlahPulang"
  ).textContent =
    pulang;


  /* ===================================================
     DATA KOSONG
  =================================================== */

  if (data.length === 0) {

    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="7"
          class="loading"
        >
          📭 Tidak ada data absensi Kelas 6.
        </td>
      </tr>
    `;

    return;
  }


  /* ===================================================
     BUAT BARIS
  =================================================== */

  const baris =
    data.map(
      (item, index) => {

        const jenis =
          String(
            item.jenis || ""
          )
          .trim()
          .toLowerCase();


        let statusHTML;


        if (jenis === "masuk") {

          statusHTML = `
            <span class="badge masuk">
              🟢 MASUK
            </span>
          `;

        } else if (jenis === "pulang") {

          statusHTML = `
            <span class="badge pulang">
              🔴 PULANG
            </span>
          `;

        } else {

          statusHTML = `
            <span class="badge">
              ${escapeHTML(
                item.jenis || "-"
              )}
            </span>
          `;

        }


        const fotoHTML =
          buatFoto(
            item.foto_path
          );


        return `
          <tr>

            <td>
              ${index + 1}
            </td>

            <td>
              <strong>
                ${escapeHTML(
                  item.nama || "-"
                )}
              </strong>
            </td>

            <td>
              ${escapeHTML(
                item.kelas || "Kelas 6"
              )}
            </td>

            <td>
              ${formatTanggal(
                dapatkanTanggal(item)
              )}
            </td>

            <td>
              ${dapatkanJam(item)}
            </td>

            <td>
              ${statusHTML}
            </td>

            <td>
              ${fotoHTML}
            </td>

          </tr>
        `;
      }
    );


  document.getElementById(
    "tabelData"
  ).innerHTML =
    baris.join("");

}


/* =====================================================
   FOTO PUBLIC DARI BUCKET selfie3
===================================================== */

function buatFoto(path) {

  if (!path) {

    return `
      <span class="foto-error">
        ❌ Tidak ada foto
      </span>
    `;

  }


  /*
    PENTING:

    Karena bucket selfie3 PUBLIC,
    kita menggunakan getPublicUrl.

    TIDAK menggunakan:
    createSignedUrl()
  */

  const hasil =
    supabaseClient
      .storage
      .from(NAMA_BUCKET)
      .getPublicUrl(path);


  const url =
    hasil.data.publicUrl;


  if (!url) {

    return `
      <span class="foto-error">
        ❌ URL foto tidak ditemukan
      </span>
    `;

  }


  /*
    Encode URL supaya aman
    dimasukkan ke onclick.
  */

  const encodedURL =
    encodeURIComponent(url);


  return `
    <div class="foto-box">

      <img
        class="foto"
        src="${url}"
        alt="Foto selfie"
        loading="lazy"
        onclick="bukaFoto('${encodedURL}')"
        onerror="fotoError(this)"
      >

      <div class="foto-buttons">

        <a
          class="lihat"
          href="${url}"
          target="_blank"
          rel="noopener"
        >
          👁️ Lihat
        </a>

        <button
          class="download"
          onclick="downloadFoto('${encodedURL}')"
        >
          📥 Simpan
        </button>

      </div>

    </div>
  `;

}


/* =====================================================
   JIKA FOTO ERROR
===================================================== */

function fotoError(img) {

  img.style.display =
    "none";


  const pesan =
    document.createElement(
      "span"
    );


  pesan.className =
    "foto-error";


  pesan.textContent =
    "❌ Foto tidak ditemukan";


  img.parentNode.prepend(
    pesan
  );

}


/* =====================================================
   BUKA FOTO BESAR
===================================================== */

function bukaFoto(
  encodedURL
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  document.getElementById(
    "fotoBesar"
  ).src =
    url;


  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


/* =====================================================
   TUTUP FOTO
===================================================== */

function tutupModal() {

  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "fotoBesar"
  ).src =
    "";

}


/* =====================================================
   DOWNLOAD FOTO
===================================================== */

async function downloadFoto(
  encodedURL
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  try {

    /*
      Ambil file dari URL PUBLIC
    */

    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Foto tidak dapat diambil."
      );

    }


    const blob =
      await response.blob();


    const blobURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      "foto-absensi-" +
      Date.now() +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    setTimeout(
      () => {
        URL.revokeObjectURL(
          blobURL
        );
      },
      1000
    );


  } catch (error) {

    console.error(
      "DOWNLOAD ERROR:",
      error
    );


    /*
      Fallback:
      buka foto di tab baru.
    */

    window.open(
      url,
      "_blank"
    );

    alert(
      "Foto sudah dibuka. Jika download tidak langsung berjalan, klik kanan foto lalu pilih 'Simpan gambar sebagai...'."
    );

  }

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
  tanggal
) {

  if (!tanggal) {
    return "-";
  }


  const bagian =
    String(
      tanggal
    ).split("-");


  if (
    bagian.length !== 3
  ) {

    return tanggal;

  }


  return (
    bagian[2] +
    "/" +
    bagian[1] +
    "/" +
    bagian[0]
  );

}


/* =====================================================
   RESET
===================================================== */

function resetFilter() {

  document.getElementById(
    "tanggal"
  ).value =
    tanggalHariIni();


  document.getElementById(
    "cari"
  ).value =
    "";


  tampilkanData();

}


/* =====================================================
   DOWNLOAD CSV
===================================================== */

function downloadCSV() {

  const tanggalDipilih =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  const data =
    semuaData.filter(
      item => {

        const kelas =
          String(
            item.kelas || ""
          )
          .trim()
          .toLowerCase();


        const cocokKelas =
          kelas === "kelas 6" ||
          kelas === "6";


        const tanggalData =
          dapatkanTanggal(item);


        const cocokTanggal =
          !tanggalDipilih ||
          tanggalData === tanggalDipilih;


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(kata);


        return (
          cocokKelas &&
          cocokTanggal &&
          cocokNama
        );

      }
    );


  if (data.length === 0) {

    alert(
      "Tidak ada data untuk didownload."
    );

    return;

  }


  let csv =
    "No,Nama,Kelas,Tanggal,Jam,Jenis,Foto Path\n";


  data.forEach(
    (item, index) => {

      const nama =
        String(
          item.nama || ""
        ).replace(
          /"/g,
          '""'
        );


      const kelas =
        String(
          item.kelas || ""
        ).replace(
          /"/g,
          '""'
        );


      const foto =
        String(
          item.foto_path || ""
        ).replace(
          /"/g,
          '""'
        );


      csv +=
        (
          index + 1
        ) +
        ',"' +
        nama +
        '","' +
        kelas +
        '",' +
        dapatkanTanggal(item) +
        "," +
        dapatkanJam(item) +
        "," +
        (
          item.jenis || ""
        ) +
        ',"' +
        foto +
        '"\n';

    }
  );


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "rekap-absensi-sd-kelas-6.csv";


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  URL.revokeObjectURL(
    url
  );

}


/* =====================================================
   ERROR BOX
===================================================== */

function tampilkanError(
  pesan
) {

  const box =
    document.getElementById(
      "errorBox"
    );


  if (!pesan) {

    box.style.display =
      "none";

    box.textContent =
      "";

    return;

  }


  box.textContent =
    pesan;


  box.style.display =
    "block";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
