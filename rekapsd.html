<!DOCTYPE html>
<html lang="id">
<head>

  <title>Rekap Absensi - Ekskul Informatika</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;

    .container {
      width: 100%;

    .header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);

    table {

      border-collapse: collapse;

    .foto-buttons {

    .foto-buttons a,

<body>

<div class="container">

  <div class="header">

  <div id="errorBox" class="error"></div>

      </div>

      <div
        class="stat-number"
        id="jumlahMasuk"
      >

      </div>

        Absen Masuk

      <div class="stat-icon">🔴</div>

      <div

<div

>

    onclick="tutupModal()"

  </span>

    alt="Foto selfie"
    onclick="event.stopPropagation()"

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   NAMA BUCKET FOTO
===================================================== */

/*
   FOTO SEKARANG DIAMBIL DARI BUCKET:
   selfie3

   BUKAN:
   selfies
*/

const NAMA_BUCKET =
  "selfie3";


/* =====================================================
   VARIABEL
===================================================== */

let semuaData = [];


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

  const sekarang = new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(2, "0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2, "0");

  return (
    tahun +
    "-" +
    bulan +
    "-" +
    hari
  );
}


document.getElementById(
  "tanggal"
).value =
  tanggalHariIni();


/* =====================================================
   AMBIL DATA SUPABASE
===================================================== */

async function ambilData() {

  tampilkanError("");

  document.getElementById(
    "tabelData"
  ).innerHTML = `
    <tr>
      <td
        colspan="6"
        class="loading"
      >
        ⏳ Memuat data...
      </td>
    </tr>
  `;


  try {

    const hasil =
      await supabaseClient
        .from("absensi")
        .select("*");


    if (hasil.error) {
      throw hasil.error;
    }


    semuaData =
      hasil.data || [];


    /* URUTKAN DATA TERBARU */

    semuaData.sort(
      (a, b) => {

        const waktuA =
          String(
            a.tanggal || ""
          ) +
          String(
            a.jam || ""
          );

        const waktuB =
          String(
            b.tanggal || ""
          ) +
          String(
            b.jam || ""
          );

        return waktuB.localeCompare(
          waktuA
        );
      }
    );


    await tampilkanData();


  } catch (error) {

    console.error(error);

    tampilkanError(
      "Gagal mengambil data: " +
      error.message
    );


    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="6"
          class="loading"
        >
          ❌ Data tidak dapat dimuat.
        </td>
      </tr>
    `;
  }
}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

async function tampilkanData() {

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  const data =
    semuaData.filter(
      item => {

        const cocokTanggal =
          !tanggal ||
          String(
            item.tanggal || ""
          ) === tanggal;


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(kata);


        return (
          cocokTanggal &&
          cocokNama
        );
      }
    );


  /* ===================================================
     STATISTIK
  =================================================== */

  const namaUnik =
    new Set(
      data.map(
        item =>
          String(
            item.nama || ""
          ).toLowerCase()
      )
    );


  const masuk =
    data.filter(
      item =>
        String(
          item.jenis || ""
        ).toLowerCase() === "masuk"
    ).length;


  const pulang =
    data.filter(
      item =>
        String(
          item.jenis || ""
        ).toLowerCase() === "pulang"
    ).length;


  document.getElementById(
    "jumlahOrang"
  ).textContent =
    namaUnik.size;


  document.getElementById(
    "jumlahMasuk"
  ).textContent =
    masuk;


  document.getElementById(
    "jumlahPulang"
  ).textContent =
    pulang;


  /* ===================================================
     DATA KOSONG
  =================================================== */

  if (data.length === 0) {

    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="6"
          class="loading"
        >
          📭 Tidak ada data absensi.
        </td>
      </tr>
    `;

    return;
  }


  /* ===================================================
     BUAT BARIS
  =================================================== */

  const baris =
    await Promise.all(
      data.map(
        async (item, index) => {

          const fotoHTML =
            await buatFoto(
              item.foto_path
            );


          const jenis =
            String(
              item.jenis || ""
            ).toLowerCase();


          const status =
            jenis === "masuk"
              ? `
                <span
                  class="badge masuk"
                >
                  🟢 MASUK
                </span>
              `
              : `
                <span
                  class="badge pulang"
                >
                  🔴 PULANG
                </span>
              `;


          return `
            <tr>

              <td>
                ${index + 1}
              </td>

              <td>
                <strong>
                  ${escapeHTML(
                    item.nama || "-"
                  )}
                </strong>
              </td>

              <td>
                ${formatTanggal(
                  item.tanggal
                )}
              </td>

              <td>
                ${formatJam(
                  item.jam
                )}
              </td>

              <td>
                ${status}
              </td>

              <td>
                ${fotoHTML}
              </td>

            </tr>
          `;
        }
      )
    );


  document.getElementById(
    "tabelData"
  ).innerHTML =
    baris.join("");
}


/* =====================================================
   FOTO DARI BUCKET SELFIE3
===================================================== */

async function buatFoto(path) {

  if (!path) {

    return `
      <span class="foto-error">
        ❌ Tidak ada foto
      </span>
    `;
  }


  try {

    /*
       Pastikan path foto bersih.
       
       Contoh path:
       2026/08/11/foto.jpg

       atau:
       foto.jpg
    */

    const fotoPath =
      String(path).trim();


    console.log(
      "Mencari foto:",
      fotoPath
    );


    /*
       BUAT SIGNED URL
       DARI BUCKET selfie3
    */

    const hasil =
      await supabaseClient
        .storage
        .from(NAMA_BUCKET)
        .createSignedUrl(
          fotoPath,
          3600
        );


    if (
      hasil.error ||
      !hasil.data ||
      !hasil.data.signedUrl
    ) {

      console.error(
        "Gagal membuat signed URL:",
        hasil.error
      );


      return `
        <div>

          <span class="foto-error">
            ❌ Foto tidak dapat dibuka
          </span>

          <br>

          <small>
            Path: ${escapeHTML(fotoPath)}
          </small>

        </div>
      `;
    }


    const url =
      hasil.data.signedUrl;


    /*
       URL disimpan dengan aman
       supaya bisa dikirim ke fungsi
    */

    const safeURL =
      encodeURIComponent(url);


    /*
       NAMA FILE UNTUK DOWNLOAD
    */

    let namaFile =
      fotoPath.split("/").pop();


    if (!namaFile) {
      namaFile =
        "foto-absensi.jpg";
    }


    const safeNamaFile =
      encodeURIComponent(
        namaFile
      );


    return `
      <div>

        <!-- FOTO -->

        <img
          class="foto"
          src="${url}"
          alt="Foto selfie"
          loading="lazy"
          onclick="bukaFoto('${safeURL}')"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
        >

        <div
          class="foto-error"
          style="display:none;"
        >
          ❌ Foto gagal ditampilkan
        </div>


        <!-- TOMBOL -->

        <div class="foto-buttons">

          <a
            class="lihat"
            href="${url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            👁️ Lihat
          </a>


          <button
            type="button"
            class="download"
            onclick="downloadFoto('${safeURL}', '${safeNamaFile}')"
          >
            📥 Simpan
          </button>

        </div>

      </div>
    `;

  } catch (error) {

    console.error(
      "Error foto:",
      error
    );


    return `
      <span class="foto-error">
        ❌ Foto error
      </span>
    `;
  }
}


/* =====================================================
   BUKA FOTO BESAR
===================================================== */

function bukaFoto(
  encodedURL
) {

  try {

    const url =
      decodeURIComponent(
        encodedURL
      );


    document.getElementById(
      "fotoBesar"
    ).src =
      url;


    document.getElementById(
      "modal"
    ).style.display =
      "flex";

  } catch (error) {

    console.error(error);

    alert(
      "Foto tidak dapat dibuka."
    );
  }
}


/* =====================================================
   TUTUP MODAL
===================================================== */

function tutupModal() {

  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "fotoBesar"
  ).src =
    "";
}


/* =====================================================
   DOWNLOAD FOTO
===================================================== */

async function downloadFoto(
  encodedURL,
  encodedNamaFile
) {

  try {

    const url =
      decodeURIComponent(
        encodedURL
      );


    const namaFile =
      decodeURIComponent(
        encodedNamaFile
      );


    /*
       Ambil file sebagai Blob
    */

    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const blob =
      await response.blob();


    /*
       Buat URL sementara
    */

    const blobURL =
      URL.createObjectURL(
        blob
      );


    /*
       Buat link download
    */

    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      namaFile ||
      "foto-absensi.jpg";


    link.style.display =
      "none";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    /*
       Hapus URL sementara
    */

    setTimeout(
      () => {
        URL.revokeObjectURL(
          blobURL
        );
      },
      1000
    );


  } catch (error) {

    console.error(
      "Download error:",
      error
    );


    /*
       Jika browser HP
       tidak mengizinkan download,
       buka foto di tab baru.
    */

    try {

      const url =
        decodeURIComponent(
          encodedURL
        );


      alert(
        "Download langsung tidak tersedia di browser ini. Foto akan dibuka."
      );


      window.open(
        url,
        "_blank"
      );

    } catch (e) {

      alert(
        "Foto tidak dapat didownload."
      );
    }
  }
}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
  tanggal
) {

  if (!tanggal) {
    return "-";
  }


  const bagian =
    String(
      tanggal
    ).split("-");


  if (
    bagian.length !== 3
  ) {
    return tanggal;
  }


  return (
    bagian[2] +
    "-" +
    bagian[1] +
    "-" +
    bagian[0]
  );
}


/* =====================================================
   FORMAT JAM
===================================================== */

function formatJam(
  jam
) {

  if (!jam) {
    return "-";
  }


  return String(
    jam
  ).substring(
    0,
    8
  );
}


/* =====================================================
   RESET FILTER
===================================================== */

function resetFilter() {

  document.getElementById(
    "tanggal"
  ).value =
    tanggalHariIni();


  document.getElementById(
    "cari"
  ).value =
    "";


  tampilkanData();
}


/* =====================================================
   DOWNLOAD CSV
===================================================== */

function downloadCSV() {

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  const data =
    semuaData.filter(
      item => {

        const cocokTanggal =
          !tanggal ||
          String(
            item.tanggal || ""
          ) === tanggal;


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(kata);


        return (
          cocokTanggal &&
          cocokNama
        );
      }
    );


  if (data.length === 0) {

    alert(
      "Tidak ada data untuk didownload."
    );

    return;
  }


  let csv =
    "No,Nama,Tanggal,Jam,Jenis,Foto Path\n";


  data.forEach(
    (item, index) => {

      const nama =
        String(
          item.nama || ""
        ).replace(
          /"/g,
          '""'
        );


      const foto =
        String(
          item.foto_path || ""
        ).replace(
          /"/g,
          '""'
        );


      csv +=
        (
          index + 1
        ) +
        ',"' +
        nama +
        '",' +
        (
          item.tanggal || ""
        ) +
        "," +
        (
          item.jam || ""
        ) +
        "," +
        (
          item.jenis || ""
        ) +
        ',"' +
        foto +
        '"\n';
    }
  );


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "rekap-absensi.csv";


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  URL.revokeObjectURL(
    url
  );
}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
  pesan
) {

  const box =
    document.getElementById(
      "errorBox"
    );


  if (!pesan) {

    box.style.display =
      "none";

    box.textContent =
      "";

    return;
  }


  box.textContent =
    pesan;

  box.style.display =
    "block";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =====================================================
   MULAI
===================================================== */

ambilData();
