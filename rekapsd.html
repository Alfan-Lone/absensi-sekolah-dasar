<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rekap Absensi SD</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: auto;
}

/* HEADER */

.header {
  background: linear-gradient(135deg, #2563eb, #1e3a8a);
  color: white;
  padding: 28px 20px;
  border-radius: 20px;
  text-align: center;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.header-icon {
  font-size: 42px;
}

.header h1 {
  margin: 5px 0;
  font-size: 28px;
}

.header p {
  margin: 5px 0 0;
  opacity: .85;
}

/* FILTER */

.card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 12px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 15px;
  background: white;
  outline: none;
}

input:focus,
select:focus {
  border-color: #2563eb;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.refresh {
  background: #2563eb;
  color: white;
}

.refresh:hover {
  background: #1d4ed8;
}

/* STATISTIK */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  background: white;
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.stat-icon {
  font-size: 25px;
}

.stat-number {
  font-size: 27px;
  font-weight: bold;
  color: #2563eb;
  margin-top: 4px;
}

.stat-label {
  color: #64748b;
  font-size: 13px;
}

/* TABLE */

.table-wrap {
  background: white;
  border-radius: 18px;
  padding: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th {
  background: #f8fafc;
  padding: 14px;
  text-align: left;
  font-size: 13px;
  border-bottom: 2px solid #e5e7eb;
}

td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 14px;
  vertical-align: middle;
}

tr:hover {
  background: #f8fafc;
}

/* STATUS */

.badge {
  display: inline-block;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: bold;
}

.masuk {
  background: #dcfce7;
  color: #166534;
}

.pulang {
  background: #fee2e2;
  color: #991b1b;
}

/* FOTO */

.foto {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 10px;
  border: 2px solid #e5e7eb;
  cursor: pointer;
  display: block;
}

.foto:hover {
  opacity: .8;
}

.foto-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.lihat-foto {
  background: #2563eb;
  color: white;
  padding: 6px 9px;
  border-radius: 7px;
  border: none;
  font-size: 11px;
  cursor: pointer;
  width: fit-content;
}

.lihat-foto:hover {
  background: #1d4ed8;
}

.foto-error {
  color: #dc2626;
  font-size: 12px;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #64748b;
}

.error {
  display: none;
  background: #fee2e2;
  color: #991b1b;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
}

/* MODAL FOTO */

.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(0,0,0,.88);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal img {
  max-width: 95%;
  max-height: 85vh;
  border-radius: 15px;
  object-fit: contain;
}

.close {
  position: fixed;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 42px;
  cursor: pointer;
  z-index: 10000;
}

/* MOBILE */

@media(max-width: 700px) {

  body {
    padding: 10px;
  }

  .header {
    padding: 22px 10px;
  }

  .header h1 {
    font-size: 23px;
  }

  .filters {
    grid-template-columns: 1fr;
  }

  .filters button {
    width: 100%;
  }

  .stats {
    gap: 7px;
  }

  .stat {
    padding: 13px 5px;
  }

  .stat-number {
    font-size: 22px;
  }

  .stat-label {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="header-icon">
      📊
    </div>

    <h1>REKAP ABSENSI SD</h1>

    <p>Data Absensi Murid</p>

  </div>

  <div id="errorBox" class="error"></div>

  <!-- FILTER -->

  <div class="card">

    <div class="filters">

      <div>

        <label>Tanggal</label>

        <input
          type="date"
          id="tanggal"
        >

      </div>

      <div>

        <label>Kelas</label>

        <select id="kelas">

          <option value="">
            Semua Kelas
          </option>

          <option value="Kelas 1">
            Kelas 1
          </option>

          <option value="Kelas 2">
            Kelas 2
          </option>

          <option value="Kelas 3">
            Kelas 3
          </option>

          <option value="Kelas 4">
            Kelas 4
          </option>

          <option value="Kelas 5">
            Kelas 5
          </option>

          <option value="Kelas 6">
            Kelas 6
          </option>

        </select>

      </div>

      <div>

        <label>Cari Nama</label>

        <input
          type="text"
          id="cari"
          placeholder="Ketik nama..."
          oninput="tampilkanData()"
        >

      </div>

      <div>

        <label>&nbsp;</label>

        <button
          class="refresh"
          onclick="ambilData()"
        >
          🔄 Refresh
        </button>

      </div>

    </div>

  </div>


  <!-- STATISTIK -->

  <div class="stats">

    <div class="stat">

      <div class="stat-icon">
        👥
      </div>

      <div
        class="stat-number"
        id="jumlahOrang"
      >
        0
      </div>

      <div class="stat-label">
        Total Siswa
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🟢
      </div>

      <div
        class="stat-number"
        id="jumlahMasuk"
      >
        0
      </div>

      <div class="stat-label">
        Absen Masuk
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🔴
      </div>

      <div
        class="stat-number"
        id="jumlahPulang"
      >
        0
      </div>

      <div class="stat-label">
        Absen Pulang
      </div>

    </div>

  </div>


  <!-- TABEL -->

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>No</th>

          <th>Nama</th>

          <th>Kelas</th>

          <th>Tanggal</th>

          <th>Jam</th>

          <th>Status</th>

          <th>Foto</th>

        </tr>

      </thead>

      <tbody id="tabelData">

        <tr>

          <td
            colspan="7"
            class="loading"
          >
            ⏳ Memuat data...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<!-- MODAL -->

<div
  class="modal"
  id="modal"
  onclick="tutupFoto()"
>

  <span
    class="close"
    onclick="tutupFoto()"
  >
    ×
  </span>

  <img
    id="fotoBesar"
    src=""
    alt="Foto selfie"
    onclick="event.stopPropagation()"
  >

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   PENGATURAN STORAGE
===================================================== */

const NAMA_BUCKET =
  "selfie3";


/* =====================================================
   DATA
===================================================== */

let semuaData = [];


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

  const sekarang = new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(2, "0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2, "0");

  return (
    tahun +
    "-" +
    bulan +
    "-" +
    hari
  );
}


document.getElementById("tanggal").value =
  tanggalHariIni();


/* =====================================================
   AMBIL DATA
===================================================== */

async function ambilData() {

  tampilkanError("");

  document.getElementById(
    "tabelData"
  ).innerHTML = `
    <tr>
      <td colspan="7" class="loading">
        ⏳ Memuat data...
      </td>
    </tr>
  `;


  try {

    const hasil =
      await supabaseClient
        .from("absensi_sd")
        .select("*");


    if (hasil.error) {

      throw hasil.error;

    }


    semuaData =
      hasil.data || [];


    /* URUTKAN */

    semuaData.sort(
      (a, b) => {

        const waktuA =
          String(a.tanggal || "") +
          String(a.jam || "");

        const waktuB =
          String(b.tanggal || "") +
          String(b.jam || "");

        return waktuB.localeCompare(
          waktuA
        );

      }
    );


    tampilkanData();


  } catch (error) {

    console.error(error);

    tampilkanError(
      "Gagal mengambil data: " +
      error.message
    );

    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="7"
          class="loading"
        >
          ❌ Data tidak dapat dimuat.
        </td>
      </tr>
    `;

  }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData() {

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  const data =
    semuaData.filter(
      item => {

        const cocokTanggal =
          !tanggal ||
          String(
            item.tanggal || ""
          ) === tanggal;


        const cocokKelas =
          !kelas ||
          String(
            item.kelas || ""
          ).toLowerCase() ===
          kelas.toLowerCase();


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(kata);


        return (
          cocokTanggal &&
          cocokKelas &&
          cocokNama
        );

      }
    );


  /* STATISTIK */

  const namaUnik =
    new Set(
      data.map(
        item =>
          String(
            item.nama || ""
          ).toLowerCase()
      )
    );


  const masuk =
    data.filter(
      item =>
        String(
          item.jenis || ""
        ).toLowerCase() ===
        "masuk"
    ).length;


  const pulang =
    data.filter(
      item =>
        String(
          item.jenis || ""
        ).toLowerCase() ===
        "pulang"
    ).length;


  document.getElementById(
    "jumlahOrang"
  ).textContent =
    namaUnik.size;


  document.getElementById(
    "jumlahMasuk"
  ).textContent =
    masuk;


  document.getElementById(
    "jumlahPulang"
  ).textContent =
    pulang;


  /* DATA KOSONG */

  if (data.length === 0) {

    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="7"
          class="loading"
        >
          📭 Tidak ada data absensi.
        </td>
      </tr>
    `;

    return;

  }


  /* BUAT BARIS */

  const baris =
    data.map(
      (item, index) => {

        const jenis =
          String(
            item.jenis || ""
          ).toLowerCase();


        let status = "";

        if (jenis === "masuk") {

          status = `
            <span class="badge masuk">
              🟢 MASUK
            </span>
          `;

        } else {

          status = `
            <span class="badge pulang">
              🔴 PULANG
            </span>
          `;

        }


        return `

          <tr>

            <td>
              ${index + 1}
            </td>

            <td>
              <strong>
                ${escapeHTML(
                  item.nama || "-"
                )}
              </strong>
            </td>

            <td>
              ${escapeHTML(
                item.kelas || "-"
              )}
            </td>

            <td>
              ${formatTanggal(
                item.tanggal
              )}
            </td>

            <td>
              ${formatJam(
                item.jam
              )}
            </td>

            <td>
              ${status}
            </td>

            <td>
              <div
                class="foto-box"
                id="foto-${index}"
              >
                ⏳ Memuat foto...
              </div>
            </td>

          </tr>

        `;

      }
    );


  document.getElementById(
    "tabelData"
  ).innerHTML =
    baris.join("");


  /* LOAD FOTO SATU PER SATU */

  data.forEach(
    async (item, index) => {

      const html =
        await buatFoto(
          item.foto_path
        );


      const element =
        document.getElementById(
          "foto-" + index
        );


      if (element) {

        element.innerHTML =
          html;

      }

    }
  );

}


/* =====================================================
   MEMBUAT URL FOTO
===================================================== */

async function buatFoto(path) {

  if (!path) {

    return `
      <span class="foto-error">
        Tidak ada foto
      </span>
    `;

  }


  try {

    let cleanPath =
      String(path).trim();


    /*
       Kalau database menyimpan URL
       Supabase lengkap, kita ambil
       path file-nya.
    */

    if (
      cleanPath.startsWith("http://") ||
      cleanPath.startsWith("https://")
    ) {

      const marker =
        "/storage/v1/object/";

      const posisi =
        cleanPath.indexOf(marker);


      if (posisi !== -1) {

        let bagian =
          cleanPath.substring(
            posisi + marker.length
          );


        /*
          Bisa berupa:

          public/selfie3/file.jpg

          authenticated/selfie3/file.jpg

          sign/selfie3/file.jpg
        */

        const bagianArray =
          bagian.split("/");


        if (
          bagianArray.length >= 3
        ) {

          bagianArray.shift();

          bagianArray.shift();

          cleanPath =
            bagianArray.join("/");

        }

      }

    }


    /*
       Kalau tersimpan:

       selfie3/foto.jpg

       hapus nama bucket.
    */

    if (
      cleanPath.startsWith(
        NAMA_BUCKET + "/"
      )
    ) {

      cleanPath =
        cleanPath.substring(
          NAMA_BUCKET.length + 1
        );

    }


    /*
       Buat SIGNED URL
    */

    const hasil =
      await supabaseClient
        .storage
        .from(NAMA_BUCKET)
        .createSignedUrl(
          cleanPath,
          3600
        );


    if (
      hasil.error ||
      !hasil.data ||
      !hasil.data.signedUrl
    ) {

      console.error(
        "Foto gagal:",
        cleanPath,
        hasil.error
      );


      return `
        <span class="foto-error">
          Foto tidak dapat dibuka
        </span>
      `;

    }


    const url =
      hasil.data.signedUrl;


    /*
       encode URL supaya aman
    */

    const encoded =
      encodeURIComponent(url);


    return `

      <img
        class="foto"
        src="${url}"
        alt="Foto selfie"
        onclick="bukaFoto('${encoded}')"
      >

      <button
        class="lihat-foto"
        onclick="bukaFoto('${encoded}')"
      >
        👁️ Lihat Foto
      </button>

    `;

  } catch (error) {

    console.error(
      "Error foto:",
      error
    );


    return `
      <span class="foto-error">
        Foto error
      </span>
    `;

  }

}


/* =====================================================
   BUKA FOTO BESAR
===================================================== */

function bukaFoto(
  encodedURL
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  document.getElementById(
    "fotoBesar"
  ).src = url;


  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


/* =====================================================
   TUTUP FOTO
===================================================== */

function tutupFoto() {

  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "fotoBesar"
  ).src = "";

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
  tanggal
) {

  if (!tanggal) {

    return "-";

  }


  const bagian =
    String(tanggal).split("-");


  if (
    bagian.length !== 3
  ) {

    return tanggal;

  }


  return (
    bagian[2] +
    "-" +
    bagian[1] +
    "-" +
    bagian[0]
  );

}


/* =====================================================
   FORMAT JAM
===================================================== */

function formatJam(
  jam
) {

  if (!jam) {

    return "-";

  }


  return String(
    jam
  ).substring(0, 8);

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
  pesan
) {

  const box =
    document.getElementById(
      "errorBox"
    );


  if (!pesan) {

    box.style.display =
      "none";

    box.textContent =
      "";

    return;

  }


  box.textContent =
    pesan;

  box.style.display =
    "block";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   FILTER TANGGAL / KELAS
===================================================== */

document.getElementById(
  "tanggal"
).addEventListener(
  "change",
  tampilkanData
);


document.getElementById(
  "kelas"
).addEventListener(
  "change",
  tampilkanData
);


/* =====================================================
   MULAI
===================================================== */

ambilData();

</script>

</body>
</html>
