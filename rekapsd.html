<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  // ISI DENGAN DATA SUPABASE YANG SAMA DENGAN INDEX.HTML

  const SUPABASE_URL =
    "https://prcnxtzhukfopcfzyczm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================================
  // VARIABEL
  // =====================================================

  let semuaData = [];


  // =====================================================
  // TANGGAL HARI INI
  // =====================================================

  function tanggalHariIni() {

    const sekarang = new Date();

    const tahun =
      sekarang.getFullYear();

    const bulan =
      String(
        sekarang.getMonth() + 1
      ).padStart(2, "0");

    const hari =
      String(
        sekarang.getDate()
      ).padStart(2, "0");

    return (
      tahun +
      "-" +
      bulan +
      "-" +
      hari
    );
  }


  document.getElementById(
    "tanggal"
  ).value = tanggalHariIni();


  // =====================================================
  // AMBIL DATA SUPABASE
  // =====================================================

  async function ambilData() {

    tampilkanError("");

    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="6"
          class="loading"
        >
          ⏳ Memuat data...
        </td>
      </tr>
    `;


    try {

      const hasil =
        await supabaseClient
          .from("absensi")
          .select("*");


      if (hasil.error) {
        throw hasil.error;
      }


      semuaData =
        hasil.data || [];


      // Urutkan dari yang terbaru

      semuaData.sort(
        (a, b) => {

          const waktuA =
            String(
              a.tanggal || ""
            ) +
            String(
              a.jam || ""
            );

          const waktuB =
            String(
              b.tanggal || ""
            ) +
            String(
              b.jam || ""
            );

          return waktuB.localeCompare(
            waktuA
          );
        }
      );


      await tampilkanData();

    } catch (error) {

      console.error(error);

      tampilkanError(
        "Gagal mengambil data: " +
        error.message
      );

      document.getElementById(
        "tabelData"
      ).innerHTML = `
        <tr>
          <td
            colspan="6"
            class="loading"
          >
            ❌ Data tidak dapat dimuat.
          </td>
        </tr>
      `;
    }
  }


  // =====================================================
  // TAMPILKAN DATA
  // =====================================================

  async function tampilkanData() {

    const tanggal =
      document.getElementById(
        "tanggal"
      ).value;


    const kata =
      document.getElementById(
        "cari"
      ).value
        .trim()
        .toLowerCase();


    const data =
      semuaData.filter(
        item => {

          const cocokTanggal =
            !tanggal ||
            String(
              item.tanggal || ""
            ) === tanggal;


          const nama =
            String(
              item.nama || ""
            ).toLowerCase();


          const cocokNama =
            !kata ||
            nama.includes(kata);


          return (
            cocokTanggal &&
            cocokNama
          );
        }
      );


    // ===================================================
    // STATISTIK
    // ===================================================

    const namaUnik =
      new Set(
        data.map(
          item =>
            String(
              item.nama || ""
            ).toLowerCase()
        )
      );


    const masuk =
      data.filter(
        item =>
          String(
            item.jenis || ""
          ).toLowerCase() === "masuk"
      ).length;


    const pulang =
      data.filter(
        item =>
          String(
            item.jenis || ""
          ).toLowerCase() === "pulang"
      ).length;


    document.getElementById(
      "jumlahOrang"
    ).textContent =
      namaUnik.size;


    document.getElementById(
      "jumlahMasuk"
    ).textContent =
      masuk;


    document.getElementById(
      "jumlahPulang"
    ).textContent =
      pulang;


    // ===================================================
    // TABEL KOSONG
    // ===================================================

    if (data.length === 0) {

      document.getElementById(
        "tabelData"
      ).innerHTML = `
        <tr>
          <td
            colspan="6"
            class="loading"
          >
            📭 Tidak ada data absensi.
          </td>
        </tr>
      `;

      return;
    }


    // ===================================================
    // BUAT BARIS
    // ===================================================

    const baris =
      await Promise.all(
        data.map(
          async (item, index) => {

            const fotoHTML =
              await buatFoto(
                item.foto_path
              );


            const jenis =
              String(
                item.jenis || ""
              ).toLowerCase();


            const status =
              jenis === "masuk"
                ? `
                  <span
                    class="badge masuk"
                  >
                    🟢 MASUK
                  </span>
                `
                : `
                  <span
                    class="badge pulang"
                  >
                    🔴 PULANG
                  </span>
                `;


            return `
              <tr>

                <td>
                  ${index + 1}
                </td>

                <td>
                  <strong>
                    ${escapeHTML(
                      item.nama || "-"
                    )}
                  </strong>
                </td>

                <td>
                  ${formatTanggal(
                    item.tanggal
                  )}
                </td>

                <td>
                  ${formatJam(
                    item.jam
                  )}
                </td>

                <td>
                  ${status}
                </td>

                <td>
                  ${fotoHTML}
                </td>

              </tr>
            `;
          }
        )
      );


    document.getElementById(
      "tabelData"
    ).innerHTML =
      baris.join("");
  }


  // =====================================================
  // FOTO PRIVATE + SIGNED URL
  // =====================================================

  async function buatFoto(path) {

    if (!path) {

      return `
        <span class="foto-error">
          Tidak ada foto
        </span>
      `;
    }


    try {

      const hasil =
        await supabaseClient
          .storage
          .from("selfies")
          .createSignedUrl(
            path,
            3600
          );


      if (
        hasil.error ||
        !hasil.data ||
        !hasil.data.signedUrl
      ) {

        console.error(
          "Gagal membuat signed URL:",
          hasil.error
        );

        return `
          <span class="foto-error">
            Foto tidak dapat dibuka
          </span>
        `;
      }


      const url =
        hasil.data.signedUrl;


      const safeURL =
        encodeURIComponent(url);


      return `
        <div>

          <img
            class="foto"
            src="${url}"
            alt="Selfie"
            onclick="bukaFoto('${safeURL}')"
          >

          <div class="foto-buttons">

            <a
              class="lihat"
              href="${url}"
              target="_blank"
            >
              👁️ Lihat
            </a>

            <button
              class="download"
              onclick="downloadFoto('${safeURL}')"
            >
              📥 Simpan
            </button>

          </div>

        </div>
      `;

    } catch (error) {

      console.error(error);

      return `
        <span class="foto-error">
          Foto error
        </span>
      `;
    }
  }


  // =====================================================
  // BUKA FOTO BESAR
  // =====================================================

  function bukaFoto(
    encodedURL
  ) {

    const url =
      decodeURIComponent(
        encodedURL
      );


    document.getElementById(
      "fotoBesar"
    ).src = url;


    document.getElementById(
      "modal"
    ).style.display =
      "flex";
  }


  function tutupModal() {

    document.getElementById(
      "modal"
    ).style.display =
      "none";


    document.getElementById(
      "fotoBesar"
    ).src = "";
  }


  // =====================================================
  // DOWNLOAD FOTO
  // =====================================================

  async function downloadFoto(
    encodedURL
  ) {

    try {

      const url =
        decodeURIComponent(
          encodedURL
        );


      const response =
        await fetch(url);


      if (!response.ok) {
        throw new Error(
          "Foto tidak dapat diunduh."
        );
      }


      const blob =
        await response.blob();


      const blobURL =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        blobURL;


      link.download =
        "selfie-absensi-" +
        Date.now() +
        ".jpg";


      document.body.appendChild(
        link
      );


      link.click();


      document.body.removeChild(
        link
      );


      URL.revokeObjectURL(
        blobURL
      );

    } catch (error) {

      console.error(error);

      // Kalau browser HP tidak mengizinkan
      // download langsung, buka fotonya.

      alert(
        "Download langsung tidak tersedia di browser ini. Foto akan dibuka, lalu tekan tahan foto untuk menyimpannya."
      );

      const url =
        decodeURIComponent(
          encodedURL
        );

      window.open(
        url,
        "_blank"
      );
    }
  }


  // =====================================================
  // FORMAT TANGGAL
  // =====================================================

  function formatTanggal(
    tanggal
  ) {

    if (!tanggal) {
      return "-";
    }


    const bagian =
      String(
        tanggal
      ).split("-");


    if (
      bagian.length !== 3
    ) {
      return tanggal;
    }


    return (
      bagian[2] +
      "-" +
      bagian[1] +
      "-" +
      bagian[0]
    );
  }


  // =====================================================
  // FORMAT JAM
  // =====================================================

  function formatJam(
    jam
  ) {

    if (!jam) {
      return "-";
    }


    return String(
      jam
    ).substring(0, 8);
  }


  // =====================================================
  // RESET FILTER
  // =====================================================

  function resetFilter() {

    document.getElementById(
      "tanggal"
    ).value =
      tanggalHariIni();


    document.getElementById(
      "cari"
    ).value =
      "";


    tampilkanData();
  }


  // =====================================================
  // DOWNLOAD CSV
  // =====================================================

  function downloadCSV() {

    const tanggal =
      document.getElementById(
        "tanggal"
      ).value;


    const kata =
      document.getElementById(
        "cari"
      ).value
        .trim()
        .toLowerCase();


    const data =
      semuaData.filter(
        item => {

          const cocokTanggal =
            !tanggal ||
            String(
              item.tanggal || ""
            ) === tanggal;


          const nama =
            String(
              item.nama || ""
            ).toLowerCase();


          const cocokNama =
            !kata ||
            nama.includes(kata);


          return (
            cocokTanggal &&
            cocokNama
          );
        }
      );


    if (data.length === 0) {

      alert(
        "Tidak ada data untuk didownload."
      );

      return;
    }


    let csv =
      "No,Nama,Tanggal,Jam,Jenis,Foto Path\n";


    data.forEach(
      (item, index) => {

        const nama =
          String(
            item.nama || ""
          ).replace(
            /"/g,
            '""'
          );


        const foto =
          String(
            item.foto_path || ""
          ).replace(
            /"/g,
            '""'
          );


        csv +=
          (
            index + 1
          ) +
          ',"' +
          nama +
          '",' +
          (
            item.tanggal || ""
          ) +
          "," +
          (
            item.jam || ""
          ) +
          "," +
          (
            item.jenis || ""
          ) +
          ',"' +
          foto +
          '"\n';
      }
    );


    const blob =
      new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      "rekap-absensi.csv";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    URL.revokeObjectURL(
      url
    );
  }


  // =====================================================
  // ERROR
  // =====================================================

  function tampilkanError(
    pesan
  ) {

    const box =
      document.getElementById(
        "errorBox"
      );


    if (!pesan) {

      box.style.display =
        "none";

      box.textContent =
        "";

      return;
    }


    box.textContent =
      pesan;

    box.style.display =
      "block";
  }


  // =====================================================
  // ESCAPE HTML
  // =====================================================

  function escapeHTML(
    text
  ) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  // =====================================================
  // MULAI
  // =====================================================

  ambilData();

</script>

</body>
