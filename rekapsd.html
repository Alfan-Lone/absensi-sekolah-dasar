<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rekap SD - Absensi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header .icon {
      font-size: 45px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 26px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: .85;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .gray {
      background: #64748b;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat {
      text-align: center;
      padding: 15px 5px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .stat-icon {
      font-size: 25px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    .stat-label {
      color: #64748b;
      font-size: 12px;
      margin-top: 3px;
    }

    .table-wrap {
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th {
      background: #f8fafc;
      padding: 12px;
      text-align: left;
      font-size: 13px;
      border-bottom: 2px solid #e5e7eb;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
    }

    .masuk {
      background: #dcfce7;
      color: #166534;
    }

    .pulang {
      background: #fee2e2;
      color: #991b1b;
    }

    .foto {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #e5e7eb;
      cursor: pointer;
      display: block;
      transition: .2s;
    }

    .foto:hover {
      opacity: .8;
      transform: scale(1.03);
    }

    .foto-error {
      color: #dc2626;
      font-size: 12px;
    }

    .foto-buttons {
      display: flex;
      gap: 5px;
      margin-top: 7px;
    }

    .foto-buttons a,
    .foto-buttons button {
      display: inline-block;
      padding: 6px 8px;
      border-radius: 7px;
      color: white;
      text-decoration: none;
      font-size: 11px;
      border: 0;
    }

    .lihat {
      background: #2563eb;
    }

    .download {
      background: #16a34a;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0,0,0,.88);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal img {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 15px;
    }

    .close {
      position: fixed;
      top: 10px;
      right: 20px;
      color: white;
      font-size: 45px;
      cursor: pointer;
    }

    @media(max-width: 650px) {

      body {
        padding: 10px;
      }

      .header {
        padding: 20px 10px;
      }

      .header h1 {
        font-size: 22px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .filters button {
        width: 100%;
      }

      .stats {
        gap: 7px;
      }

      .stat {
        padding: 12px 3px;
      }

      .stat-icon {
        font-size: 20px;
      }

      .stat-number {
        font-size: 20px;
      }

      .stat-label {
        font-size: 10px;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="icon">📊</div>

    <h1>REKAP ABSENSI SD</h1>

    <p>SDN WARNASARI</p>
  </div>


  <!-- ERROR -->
  <div id="errorBox" class="error"></div>


  <!-- FILTER -->
  <div class="card">

    <div class="filters">

      <div>
        <label>Tanggal</label>

        <input
          type="date"
          id="tanggal"
          onchange="tampilkanData()"
        >
      </div>


      <div>
        <label>Cari Nama</label>

        <input
          type="text"
          id="cari"
          placeholder="Ketik nama..."
          oninput="tampilkanData()"
        >
      </div>


      <div>
        <label>&nbsp;</label>

        <button
          class="blue"
          onclick="ambilData()"
        >
          🔄 REFRESH
        </button>
      </div>

    </div>


    <div class="actions">

      <button
        class="green"
        onclick="downloadCSV()"
      >
        📥 DOWNLOAD CSV
      </button>


      <button
        class="gray"
        onclick="resetFilter()"
      >
        ↩️ RESET
      </button>

    </div>

  </div>


  <!-- STATISTIK -->
  <div class="stats">

    <div class="stat">

      <div class="stat-icon">
        👥
      </div>

      <div
        class="stat-number"
        id="jumlahOrang"
      >
        0
      </div>

      <div class="stat-label">
        Orang
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🟢
      </div>

      <div
        class="stat-number"
        id="jumlahMasuk"
      >
        0
      </div>

      <div class="stat-label">
        Absen Masuk
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🔴
      </div>

      <div
        class="stat-number"
        id="jumlahPulang"
      >
        0
      </div>

      <div class="stat-label">
        Absen Pulang
      </div>

    </div>

  </div>


  <!-- TABEL -->
  <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>Tanggal</th>
          <th>Jam</th>
          <th>Status</th>
          <th>Foto Selfie</th>
        </tr>

      </thead>


      <tbody id="tabelData">

        <tr>

          <td
            colspan="6"
            class="loading"
          >
            ⏳ Memuat data...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<!-- MODAL FOTO -->

<div
  class="modal"
  id="modal"
  onclick="tutupModal()"
>

  <span
    class="close"
    onclick="tutupModal()"
  >
    ×
  </span>


  <img
    id="fotoBesar"
    src=""
    alt="Foto selfie"
    onclick="event.stopPropagation()"
  >

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://prcnxtzhukfopcfzyczm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wUZkF_KZgqDmhlVwdOAKRA_PkmZQ920";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   NAMA STORAGE
===================================================== */

const STORAGE_BUCKET = "selfie3";


/* =====================================================
   VARIABEL
===================================================== */

let semuaData = [];


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

  const sekarang = new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(2, "0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2, "0");

  return (
    tahun +
    "-" +
    bulan +
    "-" +
    hari
  );
}


document.getElementById("tanggal").value =
  tanggalHariIni();


/* =====================================================
   AMBIL DATA
===================================================== */

async function ambilData() {

  tampilkanError("");

  document.getElementById(
    "tabelData"
  ).innerHTML = `
    <tr>
      <td
        colspan="6"
        class="loading"
      >
        ⏳ Memuat data...
      </td>
    </tr>
  `;


  try {

    const hasil =
      await supabaseClient
        .from("absensi")
        .select("*");


    if (hasil.error) {
      throw hasil.error;
    }


    semuaData =
      hasil.data || [];


    /* URUTKAN TERBARU */

    semuaData.sort(
      (a, b) => {

        const waktuA =
          String(a.tanggal || "") +
          String(a.jam || "");

        const waktuB =
          String(b.tanggal || "") +
          String(b.jam || "");

        return waktuB.localeCompare(
          waktuA
        );
      }
    );


    await tampilkanData();

  } catch (error) {

    console.error(error);

    tampilkanError(
      "Gagal mengambil data: " +
      error.message
    );


    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="6"
          class="loading"
        >
          ❌ Data tidak dapat dimuat.
        </td>
      </tr>
    `;
  }
}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

async function tampilkanData() {

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  const data =
    semuaData.filter(
      item => {

        const cocokTanggal =
          !tanggal ||
          String(
            item.tanggal || ""
          ) === tanggal;


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(kata);


        return (
          cocokTanggal &&
          cocokNama
        );
      }
    );


  /* ===================================================
     STATISTIK
  =================================================== */

  const namaUnik =
    new Set(
      data.map(
        item =>
          String(
            item.nama || ""
          ).toLowerCase()
      )
    );


  const masuk =
    data.filter(
      item =>
        String(
          item.jenis || ""
        ).toLowerCase() === "masuk"
    ).length;


  const pulang =
    data.filter(
      item =>
        String(
          item.jenis || ""
        ).toLowerCase() === "pulang"
    ).length;


  document.getElementById(
    "jumlahOrang"
  ).textContent =
    namaUnik.size;


  document.getElementById(
    "jumlahMasuk"
  ).textContent =
    masuk;


  document.getElementById(
    "jumlahPulang"
  ).textContent =
    pulang;


  /* ===================================================
     DATA KOSONG
  =================================================== */

  if (data.length === 0) {

    document.getElementById(
      "tabelData"
    ).innerHTML = `
      <tr>
        <td
          colspan="6"
          class="loading"
        >
          📭 Tidak ada data absensi.
        </td>
      </tr>
    `;

    return;
  }


  /* ===================================================
     BUAT BARIS
  =================================================== */

  const baris =
    await Promise.all(
      data.map(
        async (item, index) => {

          const fotoHTML =
            buatFoto(
              item.foto_path
            );


          const jenis =
            String(
              item.jenis || ""
            ).toLowerCase();


          let status;


          if (jenis === "masuk") {

            status = `
              <span class="badge masuk">
                🟢 MASUK
              </span>
            `;

          } else {

            status = `
              <span class="badge pulang">
                🔴 PULANG
              </span>
            `;

          }


          return `
            <tr>

              <td>
                ${index + 1}
              </td>


              <td>
                <strong>
                  ${escapeHTML(
                    item.nama || "-"
                  )}
                </strong>
              </td>


              <td>
                ${formatTanggal(
                  item.tanggal
                )}
              </td>


              <td>
                ${formatJam(
                  item.jam
                )}
              </td>


              <td>
                ${status}
              </td>


              <td>
                ${fotoHTML}
              </td>

            </tr>
          `;
        }
      )
    );


  document.getElementById(
    "tabelData"
  ).innerHTML =
    baris.join("");
}


/* =====================================================
   FOTO PUBLIC - STORAGE SELFIE3
===================================================== */

function buatFoto(path) {

  if (!path) {

    return `
      <span class="foto-error">
        Tidak ada foto
      </span>
    `;
  }


  /*
     BUAT PUBLIC URL

     Karena bucket SELFIE3 PUBLIC,
     tidak perlu signed URL.
  */

  const hasil =
    supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(path);


  const url =
    hasil.data.publicUrl;


  if (!url) {

    return `
      <span class="foto-error">
        URL foto tidak ditemukan
      </span>
    `;
  }


  /*
     Encode URL agar aman
     ketika dikirim ke fungsi JavaScript.
  */

  const safeURL =
    encodeURIComponent(url);


  return `
    <div>

      <img
        class="foto"
        src="${url}"
        alt="Foto selfie"
        loading="lazy"
        onclick="bukaFoto('${safeURL}')"
        onerror="fotoGagal(this)"
      >


      <div class="foto-buttons">

        <a
          class="lihat"
          href="${url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          👁️ Lihat
        </a>


        <button
          class="download"
          onclick="downloadFoto('${safeURL}')"
        >
          📥 Simpan
        </button>

      </div>

    </div>
  `;
}


/* =====================================================
   JIKA FOTO GAGAL DIMUAT
===================================================== */

function fotoGagal(img) {

  img.style.display = "none";

  const parent =
    img.parentElement;

  const pesan =
    document.createElement("span");

  pesan.className =
    "foto-error";

  pesan.textContent =
    "Foto tidak ditemukan";

  parent.insertBefore(
    pesan,
    parent.firstChild
  );
}


/* =====================================================
   BUKA FOTO BESAR
===================================================== */

function bukaFoto(encodedURL) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  document.getElementById(
    "fotoBesar"
  ).src =
    url;


  document.getElementById(
    "modal"
  ).style.display =
    "flex";
}


/* =====================================================
   TUTUP MODAL
===================================================== */

function tutupModal() {

  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "fotoBesar"
  ).src =
    "";
}


/* =====================================================
   DOWNLOAD FOTO
===================================================== */

async function downloadFoto(
  encodedURL
) {

  const url =
    decodeURIComponent(
      encodedURL
    );


  try {

    /*
       Coba download menggunakan fetch
    */

    const response =
      await fetch(url);


    if (!response.ok) {
      throw new Error(
        "Foto tidak dapat diakses"
      );
    }


    const blob =
      await response.blob();


    const blobURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobURL;


    link.download =
      "selfie-absensi-" +
      Date.now() +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    setTimeout(
      () => {
        URL.revokeObjectURL(
          blobURL
        );
      },
      1000
    );


  } catch (error) {

    console.error(
      "Download error:",
      error
    );


    /*
       FALLBACK

       Kalau browser tidak mengizinkan
       download langsung, buka foto.
    */

    alert(
      "Download langsung tidak tersedia. Foto akan dibuka di tab baru. Silakan simpan foto dari browser."
    );


    window.open(
      url,
      "_blank"
    );
  }
}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(tanggal) {

  if (!tanggal) {
    return "-";
  }


  const bagian =
    String(tanggal).split("-");


  if (
    bagian.length !== 3
  ) {
    return tanggal;
  }


  return (
    bagian[2] +
    "-" +
    bagian[1] +
    "-" +
    bagian[0]
  );
}


/* =====================================================
   FORMAT JAM
===================================================== */

function formatJam(jam) {

  if (!jam) {
    return "-";
  }


  return String(
    jam
  ).substring(
    0,
    8
  );
}


/* =====================================================
   RESET FILTER
===================================================== */

function resetFilter() {

  document.getElementById(
    "tanggal"
  ).value =
    tanggalHariIni();


  document.getElementById(
    "cari"
  ).value =
    "";


  tampilkanData();
}


/* =====================================================
   DOWNLOAD CSV
===================================================== */

function downloadCSV() {

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  const kata =
    document.getElementById(
      "cari"
    ).value
      .trim()
      .toLowerCase();


  const data =
    semuaData.filter(
      item => {

        const cocokTanggal =
          !tanggal ||
          String(
            item.tanggal || ""
          ) === tanggal;


        const nama =
          String(
            item.nama || ""
          ).toLowerCase();


        const cocokNama =
          !kata ||
          nama.includes(kata);


        return (
          cocokTanggal &&
          cocokNama
        );
      }
    );


  if (data.length === 0) {

    alert(
      "Tidak ada data untuk didownload."
    );

    return;
  }


  let csv =
    "No,Nama,Tanggal,Jam,Jenis,Foto Path\n";


  data.forEach(
    (item, index) => {

      const nama =
        String(
          item.nama || ""
        ).replace(
          /"/g,
          '""'
        );


      const foto =
        String(
          item.foto_path || ""
        ).replace(
          /"/g,
          '""'
        );


      csv +=
        (
          index + 1
        ) +
        ',"' +
        nama +
        '",' +
        (
          item.tanggal || ""
        ) +
        "," +
        (
          item.jam || ""
        ) +
        "," +
        (
          item.jenis || ""
        ) +
        ',"' +
        foto +
        '"\n';
    }
  );


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "rekapsd.csv";


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  URL.revokeObjectURL(
    url
  );
}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(pesan) {

  const box =
    document.getElementById(
      "errorBox"
    );


  if (!pesan) {

    box.style.display =
      "none";

    box.textContent =
      "";

    return;
  }


  box.textContent =
    pesan;

  box.style.display =
    "block";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/* =====================================================
   MULAI
===================================================== */

ambilData();

</script>

</body>
</html>
